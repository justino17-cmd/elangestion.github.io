<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ELAN GESTION</title>
<!-- PWA : installable sur iOS, Android, Mac et Windows -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELAN GESTION">
<meta name="application-name" content="ELAN GESTION">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login" style="display:none"><div class="login-box" id="login-box"></div></div>

<!-- APP -->
<div class="app" id="app-root" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand" style="cursor:pointer" title="Paramètres — Apparence" onclick="go('parametres');document.getElementById('sidebar').classList.remove('open')">
      <div class="brand-icon" id="brand-ini">EA</div>
      <div>
        <div class="hi" id="brand-hi">Bonjour</div>
        <div class="role" id="brand-role">Administrateur</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost sm" style="width:100%;justify-content:center;margin-bottom:8px" onclick="go('parametres');document.getElementById('sidebar').classList.remove('open')">Paramètres</button>
      <button class="btn danger sm" style="width:100%;justify-content:center" onclick="logout()">⏻ Déconnexion</button>
      <div style="text-align:center;font-size:11px;color:var(--t3);margin-top:8px">ELAN GESTION · v<span id="app-ver"></span></div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="document.getElementById('sidebar').classList.remove('open')"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button class="bell" id="topbar-back" onclick="goBack()" title="Retour" style="display:none"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>


      <div class="topbar-brand mono">ELAN GESTION</div>
      <div class="topbar-title">
        <h1 id="page-title">Tableau de bord</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="gsrch" onclick="event.stopPropagation()"><span style="display:inline-flex;color:var(--t3)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><input id="gsrch-in" placeholder="Rechercher client, intervention, chantier…" oninput="gsearch(this.value)" onfocus="gsearch(this.value)"><div id="gsrch-res"></div></div>
      <button class="btn sm" id="create-btn" onclick="quickCreate()" style="white-space:nowrap">＋ Créer</button>
      <div class="topbar-actions" id="topbar-actions"></div>
      <button class="bell" id="sync-btn" onclick="syncNow()" title="Synchroniser"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      <button class="bell" id="theme-btn" onclick="toggleTheme()" title="Mode jour / sombre"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <div class="topbar-bell">
        <button class="bell" onclick="toggleNotif(event)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bell-count" id="bell-count" style="display:none">0</span></button>
        <div id="notif-panel"></div>
      </div>
      <button class="bell" id="search-btn" onclick="openSearch()" title="Rechercher partout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    </div>
    <div class="page-head" id="page-head"></div>
    <div class="content" id="content"></div>
  </div>
  <div id="assistant"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="overlay2" style="z-index:60"><div class="modal wide" id="modal2"></div></div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
