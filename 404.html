<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TEAM OP</title>
<link rel="icon" href="/icons/teamop-512.png">
<script>
/* ══ L'ADRESSE DE CHAQUE ENTREPRISE : teamop.fr/e/son-nom ═══════════════════════════════════
   GitHub Pages n'a pas de sous-domaine par entreprise (pas de elan.teamop.fr sans quitter
   Pages) mais il sert CE fichier pour toute adresse qu'il ne connaît pas. On s'en sert donc
   comme d'un aiguillage.

   POURQUOI UN PRÉFIXE « /e/ » ET PLUS teamop.fr/nom TOUT COURT.
   Parce que ça s'est cassé en production le soir même : le site porte un fichier elan.html
   (la page produit d'OP GESTION, nom hérité d'ELAN GESTION), et GitHub Pages sert /elan
   depuis ce fichier AVANT que ce script n'existe. Le client qui s'appelle ELAN tombait donc
   sur une page commerciale au lieu de sa connexion. Vingt-sept noms du site avaient le même
   piège — app, tarifs, espace, metiers, creer, dev, merci… Un préfixe qui n'est pas un fichier
   ferme la question pour toujours, au lieu d'entretenir une liste de mots interdits.

   La forme courte teamop.fr/nom continue de marcher quand elle ne heurte rien, et renvoie sur
   la forme longue : l'adresse affichée reste la même partout.

   Prudence : cette page répond aussi quand une IMAGE ou un SCRIPT manque. On n'aiguille donc
   que ce qui ressemble vraiment à un nom d'entreprise — sans extension, sans point — et on
   laisse tout le reste sur une page d'erreur honnête. */
(function(){
  /* La liste des mots réservés ne vaut QUE pour la forme courte : là, un nom peut heurter un
     dossier du dépôt. Sous /e/, rien ne peut être heurté — et une entreprise a le droit de
     s'appeler « Beta » ou « Static ». L'appliquer aux deux formes bloquait 27 noms sans raison,
     ce que le contrôle scripts/verifier-adresses.js a montré tout de suite. */
  var RESERVES=/^(api|assets|icons|img|images|css|js|static|sons|screenshots|scripts|apercu|admin|www|robots|sitemap|favicon|manifest|sw)$/i;
  function forme(x){ return !!x && !/\./.test(x) && /^[a-z0-9][a-z0-9-]{1,59}$/i.test(x); }
  function bon(x){ return forme(x) && !RESERVES.test(x); }
  try{
    var p=decodeURIComponent(location.pathname||'').replace(/^\/+|\/+$/g,'');
    if(!p) return;                                   // la racine a son index.html
    var m=p.split('/');
    // forme longue, celle qu'on donne partout : /e/nom-entreprise
    if(m.length===2 && m[0].toLowerCase()==='e' && forme(m[1])){
      location.replace('/connexion.html?e='+encodeURIComponent(m[1])); return;
    }
    // forme courte : /nom-entreprise — pratique, mais elle ne peut pas heurter un fichier du site
    if(m.length===1 && bon(m[0])){
      location.replace('/connexion.html?e='+encodeURIComponent(m[0])); return;
    }
  }catch(e){}
})();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}

  p{color:#93a9d4;font-size:14px;line-height:1.7;max-width:440px}
  a.btn{display:inline-block;margin-top:22px;background:#34d399;color:#08251a;border-radius:12px;padding:12px 22px;font-size:14.5px;font-weight:800;text-decoration:none}
  a.lien{color:#7cc6ff;text-decoration:none}
</style>
</head>
<body>
  <div class="logo"><img src="/icons/teamop-512.png" alt=""><b>TEAM OP</b></div>
  <h1>Cette page n'existe pas</h1>
  <p>L'adresse demandée est introuvable. Si tu cherchais la connexion de ton entreprise, son adresse ressemble à <b style="color:#eef2fa">teamop.fr/e/nom-de-ton-entreprise</b>.</p>
  <a class="btn" href="/connexion.html">Aller à la connexion</a>
  <p style="margin-top:18px;font-size:12.5px"><a class="lien" href="/index.html">← Site TeamOP</a></p>
</body>
