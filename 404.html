<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TEAM OP</title>
<link rel="icon" href="/icons/teamop-512.png">
<script>
/* ══ L'ADRESSE DE CHAQUE ENTREPRISE : teamop.fr/son-nom ═════════════════════════════════════
   GitHub Pages n'a pas de sous-domaines par entreprise (pas de elan.teamop.fr sans quitter
   Pages) mais il sert CE fichier pour toute adresse qu'il ne connaît pas. On s'en sert donc
   comme d'un aiguillage : « teamop.fr/elan » ouvre la connexion de l'entreprise « elan ».

   Prudence : cette page répond aussi quand une IMAGE ou un SCRIPT manque. On n'aiguille donc
   que ce qui ressemble vraiment à un nom d'entreprise — un seul segment, sans extension, sans
   point — et on laisse tout le reste sur une page d'erreur honnête. Autrement, un fichier
   absent renverrait le visiteur sur un écran de connexion, ce qui n'aide personne. */
(function(){
  try{
    var p=decodeURIComponent(location.pathname||'').replace(/^\/+|\/+$/g,'');
    if(!p) return;                                   // la racine a son index.html
    if(p.indexOf('/')>=0) return;                    // sous-dossier (apercu/…, icons/…) : ce n'est pas une entreprise
    if(/\./.test(p)) return;                         // un point = un fichier (.js, .png, .html) qui manque vraiment
    if(!/^[a-z0-9][a-z0-9-]{1,59}$/i.test(p)) return;
    // les mots réservés du site ne sont jamais des noms d'entreprise
    if(/^(api|assets|icons|img|images|css|js|static|apercu|beta|admin|www|robots|sitemap|favicon|manifest|sw|app|tour|messages|espace|index|connexion|reinit|cgv|cgu|contact|tarifs|blog)$/i.test(p)) return;
    location.replace('/connexion.html?e='+encodeURIComponent(p));
  }catch(e){}
})();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:#0a1120;background:radial-gradient(1200px 700px at 70% -10%,#12203a 0%,#0a1120 55%);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#eef2fa;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo img{width:46px;height:46px;border-radius:12px}
  .logo b{font-size:21px;letter-spacing:2px;font-family:ui-monospace,'Space Mono',monospace}
  h1{font-size:19px;margin-bottom:10px}
  p{color:#93a9d4;font-size:14px;line-height:1.7;max-width:420px}
  a.btn{display:inline-block;margin-top:22px;background:#34d399;color:#08251a;border-radius:12px;padding:12px 22px;font-size:14.5px;font-weight:800;text-decoration:none}
  a.lien{color:#7cc6ff;text-decoration:none}
</style>
</head>
<body>
  <div class="logo"><img src="/icons/teamop-512.png" alt=""><b>TEAM OP</b></div>
  <h1>Cette page n'existe pas</h1>
  <p>L'adresse demandée est introuvable. Si tu cherchais la connexion de ton entreprise, son adresse ressemble à <b style="color:#eef2fa">teamop.fr/nom-de-ton-entreprise</b>.</p>
  <a class="btn" href="/connexion.html">Aller à la connexion</a>
