<!DOCTYPE html>
<html lang="fr" data-theme="sombre">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#222733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OP MESSAGES">
<link rel="manifest" href="manifest-opmsg.webmanifest">
<link rel="apple-touch-icon" href="icons/opmsg-apple-touch.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/opmsg-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/opmsg-192.png">
<title>OP MESSAGES — Messagerie d'entreprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
  /* ══ OP MESSAGES — Refonte visuelle (handoff design 07/2026) — tokens oklch, thèmes clair/sombre ══ */
  html[data-theme="clair"]{
    --bg:oklch(0.995 0.001 250); --sd:oklch(0.98 0.004 250);
    --brd:oklch(0.925 0.006 250); --brd2:oklch(0.885 0.008 250);
    --sep:oklch(0.945 0.005 250);
    --card:#ffffff; --card-brd:oklch(0.925 0.006 250);
    --bg1:#ffffff; --card2:oklch(0.955 0.006 250);
    --inp:oklch(0.955 0.006 250); --inp-h:oklch(0.93 0.008 250); --hov:oklch(0.975 0.004 250);
    --t1:oklch(0.25 0.015 262); --t2:oklch(0.53 0.012 260); --t3:oklch(0.60 0.01 260); --lbl:oklch(0.65 0.01 260);
    /* le bleu : un peu plus profond, moins criard — réservé aux actions */
    --op:oklch(0.47 0.14 262); --op-h:oklch(0.41 0.14 262); --op-tx:oklch(0.43 0.13 262); --op-l:oklch(0.45 0.14 262);
    --tint:oklch(0.93 0.04 262); --tint2:oklch(0.945 0.028 262); --tint3:oklch(0.95 0.014 262);
    --pill-bg:#ffffff; --pill-brd:oklch(0.72 0.10 262); --pill-brd-h:oklch(0.55 0.15 262); --pill-bg-h:oklch(0.975 0.01 262);
    --pill-on-bg:oklch(0.93 0.04 262); --pill-on-brd:oklch(0.62 0.13 262); --pill-on-tx:oklch(0.45 0.17 262);
    --green:oklch(0.60 0.14 152); --green-h:oklch(0.55 0.14 152); --green-tx:#ffffff; --pres:oklch(0.60 0.14 152);
    --etab-bg:oklch(0.93 0.05 155); --etab-tx:oklch(0.38 0.11 152);
    --amber:oklch(0.62 0.13 75); --amber-bg:oklch(0.96 0.035 85); --absent:oklch(0.75 0.13 75);
    --red:oklch(0.55 0.16 25); --off:oklch(0.80 0.005 260);
    --seg-on:#ffffff; --seg-sh:0 1px 4px rgba(20,30,60,.10);
    --badge-bg:oklch(0.44 0.12 262); --badge-tx:#ffffff;   /* pastilles : plus sourdes */
    --tile-bg:oklch(0.95 0.014 262); --tile-tx:oklch(0.48 0.17 262);
    --addbtn-bg:oklch(0.945 0.028 262); --addbtn-tx:oklch(0.45 0.17 262);
    --fab-sh:0 10px 24px oklch(0.50 0.17 262 / 0.35);
    --today-hd:oklch(0.955 0.02 262); --today-col:oklch(0.985 0.008 262);
    --cal-bg:#ffffff; --cal-line:oklch(0.855 0.008 250); --cal-line2:oklch(0.80 0.010 250);
    --cal-we:oklch(0.965 0.012 262); --cal-today:oklch(0.975 0.014 262); --cal-todayhd:oklch(0.94 0.03 262);
    --blk-blue:oklch(0.93 0.04 262); --blk-blue-tx:oklch(0.40 0.15 262); --blk-blue-sub:oklch(0.48 0.13 262);
    --blk-green:oklch(0.93 0.05 155); --blk-green-tx:oklch(0.35 0.10 152); --blk-green-sub:oklch(0.45 0.09 152);
    --imminent-sh:0 4px 10px oklch(0.50 0.17 262 / 0.30);
  }
  html[data-theme="sombre"]{
    --bg:oklch(0.25 0.014 262); --sd:oklch(0.215 0.014 262);
    --brd:oklch(0.31 0.014 262); --brd2:oklch(0.36 0.016 262);
    --sep:oklch(0.32 0.014 262);
    --card:oklch(0.275 0.015 262); --card-brd:oklch(0.33 0.015 262);
    --bg1:oklch(0.245 0.015 262); --card2:oklch(0.29 0.016 262);
    --inp:oklch(0.29 0.016 262); --inp-h:oklch(0.325 0.018 262); --hov:oklch(0.30 0.017 262);
    --t1:oklch(0.93 0.005 260); --t2:oklch(0.67 0.01 260); --t3:oklch(0.62 0.01 260); --lbl:oklch(0.50 0.012 260);
    --op:oklch(0.55 0.13 262); --op-h:oklch(0.60 0.12 260); --op-tx:oklch(0.78 0.08 262); --op-l:oklch(0.78 0.08 262);
    --tint:oklch(0.315 0.05 262); --tint2:oklch(0.24 0.025 261); --tint3:oklch(0.325 0.04 260);
    --pill-bg:oklch(0.19 0.02 263); --pill-brd:oklch(0.45 0.08 262); --pill-brd-h:oklch(0.58 0.10 262); --pill-bg-h:oklch(0.24 0.03 262);
    --pill-on-bg:oklch(0.315 0.05 262); --pill-on-brd:oklch(0.52 0.10 262); --pill-on-tx:oklch(0.76 0.11 262);
    --green:oklch(0.66 0.12 152); --green-h:oklch(0.70 0.12 152); --green-tx:oklch(0.15 0.04 152); --pres:oklch(0.68 0.12 155);
    --etab-bg:oklch(0.66 0.12 152); --etab-tx:oklch(0.15 0.04 152);
    --amber:oklch(0.82 0.11 80); --amber-bg:oklch(0.36 0.05 80); --absent:oklch(0.75 0.13 75);
    --red:oklch(0.72 0.12 25); --off:oklch(0.55 0.01 260);
    --seg-on:oklch(0.375 0.022 262); --seg-sh:none;
    --badge-bg:oklch(0.66 0.09 258); --badge-tx:oklch(0.15 0.03 262);
    --tile-bg:oklch(0.325 0.04 260); --tile-tx:oklch(0.82 0.09 258);
    --addbtn-bg:oklch(0.55 0.15 262); --addbtn-tx:#ffffff;
    --fab-sh:0 10px 24px rgba(0,0,0,.45);
    --today-hd:oklch(0.30 0.04 262); --today-col:oklch(0.27 0.02 262);
    --cal-bg:oklch(0.335 0.014 262); --cal-line:oklch(0.47 0.020 262); --cal-line2:oklch(0.55 0.025 262);
    --cal-we:oklch(0.305 0.018 261); --cal-today:oklch(0.375 0.030 262); --cal-todayhd:oklch(0.435 0.050 262);
    --blk-blue:oklch(0.35 0.06 262); --blk-blue-tx:oklch(0.90 0.04 262); --blk-blue-sub:oklch(0.78 0.06 262);
    --blk-green:oklch(0.38 0.06 152); --blk-green-tx:oklch(0.93 0.05 155); --blk-green-sub:oklch(0.85 0.07 152);
    --imminent-sh:0 4px 12px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t1);font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden}
  .ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-variation-settings:'FILL' 0,'wght' 500;-webkit-font-smoothing:antialiased;user-select:none;flex-shrink:0}
  .ms.f1{font-variation-settings:'FILL' 1,'wght' 500}
  .wrap{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
  .center-page{height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .panel{background:var(--card);border:1px solid var(--card-brd);border-radius:22px;padding:26px;width:100%;max-width:420px}
  .logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
  .logo b{font-weight:800;letter-spacing:.12em;font-size:16px}
  .sub{text-align:center;color:var(--t2);font-size:14px;margin:4px 0 20px}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;border:none;background:var(--inp);cursor:pointer;font-weight:700;font-size:14px;color:var(--t2)}
  .tab:hover{background:var(--inp-h)}
  .tab.active{background:var(--tint);color:var(--op-tx);font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
  .field input{width:100%;background:var(--inp);border:1px solid transparent;border-radius:12px;padding:13px 14px;color:var(--t1);font-size:15px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--op)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--op);color:#fff;border:none;border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
  .btn:hover{background:var(--op-h)}
  .btn.green{background:var(--green);color:var(--green-tx)}.btn.green:hover{background:var(--green-h)}
  .btn.ghost{background:var(--card);border:1px solid var(--card-brd);color:var(--t1)}
  .btn.ghost:hover{background:var(--hov);border-color:var(--brd2)}
  .btn.block{width:100%}.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
  .hbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 17px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;border:none;font-family:inherit;color:var(--t1);transition:background .15s,border-color .15s;white-space:nowrap}
  /* le bouton d'action : présent, mais il ne mange plus l'écran */
  .hbtn.blue{background:transparent;color:var(--op-tx);border:1.5px solid var(--op-tx)}
  .hbtn.blue:hover{background:var(--tint2)}
  .hbtn.green{background:var(--green);color:var(--green-tx)}.hbtn.green:hover{background:var(--green-h)}
  .hbtn.neutral{background:var(--card);border:1px solid var(--card-brd)}.hbtn.neutral:hover{border-color:var(--brd2)}
  .muted{color:var(--t3);font-size:13px}.center{text-align:center}.hide{display:none!important}
  .err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);border-radius:10px;padding:10px 13px;font-size:13.5px;margin-bottom:12px}
  .ok{background:rgba(34,177,76,.12);border:1px solid rgba(34,177,76,.3);color:var(--pres);border-radius:10px;padding:10px 13px;font-size:13.5px;margin-bottom:12px}
  a.link{color:var(--op-l);cursor:pointer;text-decoration:underline;font-size:13.5px}
  /* APP SHELL */
  .appbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;background:transparent}
  .appbar img{width:34px;height:34px;border-radius:10px;flex-shrink:0}
  .appbar .tt{flex:1;min-width:0}.appbar .tt b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.appbar .tt span{font-size:11px;color:var(--t3)}
  .appbar .ic{width:40px;height:40px;border-radius:12px;border:none;background:var(--inp);color:var(--t1);font-size:17px;cursor:pointer;flex-shrink:0}
  .appbar .ic:hover{background:var(--inp-h)}
  .appbar .ic.accent{background:var(--addbtn-bg);color:var(--addbtn-tx);font-size:22px}
  /* le bouton jour / nuit : un seul clic, visible en permanence */
  .thbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--brd2);background:transparent;color:var(--t2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex-shrink:0;
    transition:color .15s,border-color .15s,background .15s}
  .thbtn:hover{color:var(--op-tx);border-color:var(--op)}
  .thbtn.jour{color:var(--amber);border-color:var(--amber)}
  .thbtn.nuit{color:var(--op-tx)}
  /* la barre de recherche du tableau de bord : longue, transparente, centree */
  .dashrech{flex:0 1 620px;min-width:220px;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:11px;
    padding:13px 20px;border-radius:14px;background:transparent;border:1px solid var(--brd2);
    color:var(--t3);font-size:14px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s}
  .dashrech:hover{border-color:var(--op);color:var(--t2)}
  /* la carte d'information qui suit la souris sur une reunion */
  #dashhov{position:fixed;left:0;top:0;z-index:58;width:286px;max-width:calc(100vw - 20px);
    padding:13px 15px;border-radius:14px;background:var(--card);border:1px solid var(--brd2);
    box-shadow:0 14px 38px rgba(0,0,0,.30);opacity:0;pointer-events:none;transition:opacity .12s;display:none}
  #dashhov.on{opacity:1;display:block}
  /* glisser une réunion : la case visée se signale, le carré suit le pointeur,
     et pendant le glissement les autres blocs laissent passer le pointeur */
  .survol-depot{outline:2px dashed var(--op);outline-offset:-2px;background-color:var(--tint2)!important}
  #dash-cal.deplace .plbloc{pointer-events:none!important}
  .plbloc.tirable{touch-action:none;cursor:grab!important}
  .plbloc.tirable:active{cursor:grabbing!important}
  .plbloc.attrape{opacity:.88;z-index:9;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:none!important}
  /* pas de sélection de texte dans le calendrier : c'est elle qui coloriait
     les « + » invisibles en carrés roses pendant le glissement */
  #dash-cal{user-select:none;-webkit-user-select:none}
  /* la bulle qui suit le glissement : elle dit l'heure EXACTE où la réunion
     va se poser, pour viser la minute qu'on veut */
  #tirehov{position:fixed;z-index:99;padding:6px 11px;border-radius:9px;background:var(--op);color:#fff;
    font-size:13px;font-weight:800;pointer-events:none;display:none;font-variant-numeric:tabular-nums;
    box-shadow:0 8px 20px rgba(0,0,0,.35);white-space:nowrap}
  .dstat{cursor:pointer;transition:border-color .15s,transform .12s}
  .dstat:hover{border-color:var(--op);transform:translateY(-1px)}
  .sptab{padding:11px;border-radius:12px;border:none;background:var(--inp);color:var(--t2);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
  .sptab:hover{background:var(--inp-h)}
  .sptab.on-perso{background:var(--op);color:#fff;font-weight:800}
  .sptab.on-ent{background:var(--etab-bg);color:var(--etab-tx);font-weight:800}
  .view{flex:1;overflow-y:auto;padding:8px 14px 88px}
  .view-h{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 14px;gap:10px;flex-wrap:wrap}
  .view-h h2{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  @media(max-width:767px){ .view-h h2{font-size:23px} }
  .gsearch{display:flex;align-items:center;gap:10px;background:var(--inp);border:none;border-radius:12px;padding:13px 16px;margin:0 0 14px;color:var(--t3)}
  .gsearch input{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:14.5px;font-family:inherit}
  .gsearch input::placeholder{color:var(--t3)}
  .gsearch svg{color:var(--t3);flex-shrink:0}
  .seg{display:inline-flex;gap:4px;padding:4px;background:var(--inp);border-radius:12px}
  .seg button{padding:8px 18px;border-radius:9px;border:none;background:transparent;color:var(--t2);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s,color .15s}
  .seg button:hover{color:var(--t1)}
  .seg button.on{background:var(--seg-on);box-shadow:var(--seg-sh);color:var(--t1);font-weight:700}
  .sec-lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin:0 2px 8px;font-weight:700}
  .card{border:1px solid var(--card-brd);border-radius:14px;background:var(--card)}
  .listbox{border:1px solid var(--card-brd);border-radius:16px;overflow:hidden;background:var(--card)}
  .listbox>*+*{border-top:1px solid var(--sep)}
  .lrow{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:background .15s}
  .lrow:hover{background:var(--hov)}
  .cava{width:44px;height:44px;flex-shrink:0;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
  .pdot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:999px;border:2px solid var(--card)}
  @media(max-width:520px){ .lrow .rbtn{width:33px;height:33px} .lrow .rbtn+.rbtn{margin-left:-2px} }
  .rbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--brd2);background:transparent;color:var(--op-tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s}
  .rbtn:hover{border-color:var(--op)}
  .joinbtn{padding:8px 16px;border-radius:999px;background:var(--green);color:var(--green-tx);font-weight:800;font-size:12.5px;border:none;cursor:pointer;font-family:inherit;flex-shrink:0}
  .joinbtn:hover{background:var(--green-h)}
  .row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--card-brd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
  .row:hover{background:var(--hov)}
  .row .ava{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
  .row .info{flex:1;min-width:0}.row .info .nm{font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .info .ds{font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .row .chev{color:var(--t3);font-size:20px}
  .listbox .row,.listbox .sw-wrap .row{border:none;border-radius:0;margin:0;padding:15px 18px}
  .dash-pp{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;cursor:pointer;border:2px solid transparent;flex-shrink:0}
  .dash-pp.sel{border-color:var(--green)}
  .fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;width:54px;height:54px;border-radius:18px;background:var(--op);color:#fff;border:none;font-size:25px;box-shadow:var(--fab-sh);cursor:pointer}
  .fab:hover{background:var(--op-h)}
  /* Barre du bas flottante (mobile) */
  .nav{position:fixed;left:16px;right:16px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:14;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--sd) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--brd);border-radius:24px;padding:4px 5px;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:440px;margin:0 auto}
  .nav button{flex:1;background:transparent;border:none;border-radius:18px;color:var(--t3);font-family:inherit;font-size:9.5px;font-weight:600;padding:4px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s;min-width:0;white-space:nowrap;position:relative;z-index:1}
  .nav button.on{color:var(--op-tx)}
  #nav-blob{position:absolute;top:4px;bottom:4px;left:0;width:70px;border-radius:18px;background:var(--inp);box-shadow:inset 0 0 0 1px var(--brd);z-index:0;pointer-events:none;transition:transform .38s cubic-bezier(.3,1.35,.45,1);will-change:transform;transform:translateX(5px)}
  .nav button .ni{display:flex;align-items:center;justify-content:center;height:19px;position:relative}
  .nav button .ni svg{width:17px;height:17px}
  .nav button .ni img{width:19px;height:19px;border-radius:50%;object-fit:cover}
  .nav .navdot{position:absolute;top:-3px;right:-7px;min-width:14px;height:14px;padding:0 3px;border-radius:8px;background:var(--badge-bg);color:var(--badge-tx);font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .appbar .ic,.topbar .ic,.composer .ic,.composer .send,.fab,.rbtn{display:inline-flex;align-items:center;justify-content:center}
  button svg{pointer-events:none}
  /* CHAT */
  .chat{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
  .chat.open{display:flex}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--sd);border-bottom:1px solid var(--brd)}
  .topbar .bk{background:transparent;border:none;color:var(--t1);font-size:22px;cursor:pointer;padding:0 4px;border-radius:10px}
  .topbar .bk:hover{background:var(--hov)}
  .topbar .ava{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .topbar .ti{flex:1;min-width:0}.topbar .ti b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topbar .ti span{font-size:11px;color:var(--t3)}
  .topbar .ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--brd2);background:transparent;color:var(--t2);font-size:16px;cursor:pointer}

  .m{max-width:80%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;word-wrap:break-word}
  .m.them{align-self:flex-start;background:var(--card);border:1px solid var(--card-brd);border-bottom-left-radius:5px}
  .m.me{align-self:flex-end;background:var(--op);color:#fff;border-bottom-right-radius:5px}
  .m .who{font-size:11.5px;font-weight:700;color:var(--op-tx);margin-bottom:2px}.m.me .who{color:#fff;opacity:.75}
  .m img{max-width:100%;border-radius:10px;margin-top:6px;display:block;cursor:pointer}
  .m .filechip{display:flex;align-items:center;gap:8px;margin-top:6px;padding:9px 12px;background:rgba(127,127,127,.14);border:1px solid var(--brd2);border-radius:10px;color:inherit;font-size:13.5px;word-break:break-all;cursor:pointer}
  .m.me .filechip{background:rgba(0,0,0,.15);border-color:rgba(255,255,255,.25)}
  /* dans MA bulle (fond bleu), un lien reste lisible */
  .m.me a{color:#fff!important;text-decoration-color:rgba(255,255,255,.7)}
  .m .t{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
  .composer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sd);border-top:1px solid var(--brd)}
  .composer .ic{width:42px;height:42px;border-radius:12px;border:1px solid var(--brd2);background:transparent;color:var(--t2);font-size:22px;cursor:pointer;flex-shrink:0}
  .composer .ic:hover{border-color:var(--op)}
  .composer input{flex:1;background:var(--inp);border:1px solid transparent;border-radius:22px;padding:12px 16px;color:var(--t1);font-size:15px;font-family:inherit;outline:none}
  .composer input:focus{border-color:var(--op)}
  .composer .send{width:46px;height:46px;border-radius:50%;background:var(--op);color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0}
  .composer .send:hover{background:var(--op-h)}
  /* sheet */
  .sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
  .sheet.open{display:flex}
  /* NOS FENETRES : celles qui remplacent les boîtes grises du navigateur.
     Au milieu de l'écran, aux couleurs de l'application, lisibles partout. */
  .opdlg{position:fixed;inset:0;z-index:78;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:22px}
  .opdlg.open{display:flex}
  .opdlg-c{background:var(--card);border:1px solid var(--card-brd);border-radius:20px;width:100%;max-width:420px;
    padding:20px 20px 16px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:shPop .16s ease-out}
  .opdlg-t{font-family:'Space Mono',monospace;font-size:15.5px;font-weight:700;margin-bottom:8px}
  .opdlg-m{font-size:14px;line-height:1.55;color:var(--t2);white-space:pre-line}
  .opdlg-c input,.opdlg-c textarea{width:100%;margin-top:14px;background:var(--inp);border:1px solid var(--brd2);border-radius:12px;
    padding:11px 13px;color:var(--t1);font-size:15px;font-family:inherit;outline:none}
  .opdlg-c input:focus,.opdlg-c textarea:focus{border-color:var(--op)}
  .opdlg-c textarea{min-height:96px;resize:vertical;line-height:1.5}
  .opdlg-b{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  @keyframes shPop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
  /* Une vraie fenêtre : barre de titre en haut, contenu qui défile au milieu,
     boutons toujours visibles en bas. Sur téléphone elle monte du bas ;
     sur ordinateur elle s'ouvre au milieu de l'écran (voir @media plus bas). */
  .sheet-c{background:var(--card);border:1px solid var(--card-brd);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:0 auto;
    max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;padding:0}
  .sh-bar{display:flex;align-items:center;gap:10px;padding:13px 13px 13px 20px;border-bottom:1px solid var(--sep);flex:none}
  .sh-bar b{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--brd2);background:transparent;color:var(--t2);flex:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700}
  .sh-x:hover{background:var(--hov);color:var(--t1);border-color:var(--brd2)}
  .sh-body{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 20px}
  .sh-pied{flex:none;display:flex;align-items:center;gap:9px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--sep);background:var(--card)}
  .sh-pied .sh-fermer{flex:1}
  .sh-actions{flex:1;display:flex;gap:9px;min-width:0;flex-wrap:wrap}
  .sh-actions .btn{flex:1;margin:0!important;white-space:nowrap}
  /* sur un petit écran, le bouton principal passe sur sa propre ligne
     plutôt que de couper son texte en trois */
  @media(max-width:560px){
    .sh-actions .btn{flex:1 1 auto;min-width:calc(50% - 5px);font-size:13px;padding:11px 8px}
  }
  .mrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--sep)}
  .mrow .ma{width:38px;height:38px;border-radius:999px;background:var(--tile-bg);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tile-tx)}
  .chk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--card-brd);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .chk:hover{background:var(--hov)}
  .chk.sel{border-color:var(--op);background:var(--tint2)}
  /* viewer + jitsi */
  .viewer,.jitsi{position:fixed;inset:0;z-index:60;background:#0a0e16;display:none;flex-direction:column}
  .viewer.open,.jitsi.open{display:flex}
  /* L'APPEL RÉDUIT : une vignette dans le coin. On continue de parler et de
     voir la personne pendant qu'on se sert de l'application. */
  #visio.mini{inset:auto;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));width:172px;height:238px;
    transition:right .18s,left .18s,top .18s,bottom .18s;touch-action:none;
    border-radius:18px;overflow:hidden;z-index:75;box-shadow:0 12px 36px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2)}
  #visio.mini .vbar,#visio.mini #visio-outils,#visio.mini #visio-tchat,#visio.mini #visio-barre{display:none!important}
  #visio.mini #visio-grille{padding:0!important;gap:0!important}
  #visio-minibar{display:none}
  /* ══ L'APPEL FAÇON TÉLÉPHONE ══
     Un appel à deux n'est pas une réunion : l'autre personne prend TOUT
     l'écran, mon image flotte en petite vignette, le nom et la durée sont
     posés dessus, et les boutons ronds flottent en bas — comme WhatsApp. */
  #visio.tel .vbar{position:absolute;top:0;left:0;right:0;z-index:5;border-bottom:none;
    background:linear-gradient(rgba(6,9,16,.72),transparent);padding-bottom:26px}
  #visio.tel #visio-grille{padding:0!important;gap:0!important}
  #visio.tel #visio-barre{position:absolute;left:0;right:0;bottom:0;z-index:5;background:transparent;
    background:linear-gradient(transparent,rgba(6,9,16,.78));padding-top:30px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  #visio.tel #visio-barre button{backdrop-filter:blur(8px)}
  /* en appel, le gros bouton rouge suffit : « Quitter » ne mange plus la place */
  #visio.tel .vbar .btn.ghost{display:none}
  #visio.tel #visio-nom{font-size:15px}
  #visio.tel #visio-etat{font-size:11.5px}
  /* tout tient sur UNE rangée, même sur un petit téléphone */
  @media(max-width:560px){
    #visio.tel #visio-barre{gap:8px;padding-left:8px;padding-right:8px}
    #visio.tel #visio-barre button{width:42px!important;height:42px!important;font-size:16px!important}
    #visio.tel #visio-barre button[title="Raccrocher"]{width:54px!important;border-radius:21px!important}
  }
  #visio.tel #visio-attente{position:absolute;top:calc(54px + env(safe-area-inset-top));left:12px;right:12px;z-index:6;border-radius:14px;border-bottom:none}
  #visio.tel .vbar,#visio.tel #visio-barre{transition:opacity .25s}
  #visio.tel.calme .vbar,#visio.tel.calme #visio-barre{opacity:0;pointer-events:none}
  .vmoi{position:absolute;right:12px;bottom:calc(118px + env(safe-area-inset-bottom));width:104px;height:148px;z-index:4;
    cursor:pointer;transition:right .18s,left .18s,top .18s,bottom .18s;
    border-radius:16px;overflow:hidden;background:#141a26;box-shadow:0 10px 26px rgba(0,0,0,.5);border:1.5px solid rgba(255,255,255,.25)}
  @media(min-width:900px){ .vmoi{width:170px;height:126px} }
  .vmoi.hg{left:12px;right:auto;top:calc(96px + env(safe-area-inset-top));bottom:auto}
  .vmoi.hd{right:12px;left:auto;top:calc(96px + env(safe-area-inset-top));bottom:auto}
  .vmoi.bg{left:12px;right:auto;bottom:calc(118px + env(safe-area-inset-bottom));top:auto}
  /* ══ LA RÉUNION PRO — l'habillage ══ */
  #visio{background:radial-gradient(1200px 700px at 50% -10%, #141c31 0%, #0a0e18 60%)}
  #visio .vbar{background:rgba(12,17,30,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
  #visio-grille{background:transparent!important}
  /* le dock du bas, flottant, en verre */
  #visio-barre{background:transparent!important;padding:6px 10px calc(14px + env(safe-area-inset-bottom))!important}
  #visio-dock{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap;
    background:rgba(16,22,38,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:10px 12px 8px;
    box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .vact{display:flex;flex-direction:column;align-items:center;gap:4px;color:#9aa6c0;font-size:10px;font-weight:600;min-width:52px;letter-spacing:.01em}
  .vbt{width:46px;height:46px;border-radius:15px;border:none;background:rgba(255,255,255,.09);color:#fff;
    font-size:19px;cursor:pointer;transition:background .15s,transform .1s;display:flex;align-items:center;justify-content:center}
  .vbt:hover{background:rgba(255,255,255,.16)}
  .vbt:active{transform:scale(.94)}
  .vbt.rouge{background:#e05252}
  @keyframes vbtAttend{0%,100%{background:rgba(79,124,255,.85)}50%{background:rgba(79,124,255,.35)}}
  .vbt.attend{animation:vbtAttend 1.1s ease-in-out infinite}
  .vact.fin .vbt{width:58px;border-radius:17px;background:#e0364a;box-shadow:0 6px 18px rgba(224,54,74,.35)}
  /* les vues, en sélecteur d'un seul tenant */
  #visio-vues{background:rgba(255,255,255,.07);border-radius:11px;padding:3px;gap:2px}
  .vv{border:none;background:transparent;color:#aab6d2;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
  .vv.on{background:var(--op);color:#fff;box-shadow:0 2px 8px rgba(79,124,255,.35)}
  /* les tuiles : douces, encadrées, ombrées */
  .tuilev{border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .nomv{background:rgba(10,14,24,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08)}
  /* le halo de la voix : doux, jamais agressif */
  @keyframes haloParle{0%,100%{box-shadow:0 0 0 2px rgba(62,207,142,.85),0 0 22px rgba(62,207,142,.25)}50%{box-shadow:0 0 0 2px rgba(62,207,142,.55),0 0 30px rgba(62,207,142,.4)}}
  .parlev{animation:haloParle 1.6s ease-in-out infinite}
  /* les panneaux : verre sombre */
  #visio-parts,#visio-tchat{background:rgba(13,19,34,.94)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid rgba(255,255,255,.07)!important}
  #visio-parts-liste>div:hover{background:rgba(255,255,255,.04)}
  /* la palette de réactions */
  #visio-reacs-pop{background:rgba(18,24,42,.9)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.1)!important;box-shadow:0 16px 44px rgba(0,0,0,.55)!important}
  #visio-reacs-pop button{transition:transform .12s}
  #visio-reacs-pop button:hover{transform:scale(1.3)}
  #visio.tel #visio-vues,#visio.mini #visio-vues{display:none!important}
  #visio.tel .vact span{display:none}
  #visio.tel #visio-dock{background:transparent;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  #visio.mini #visio-minibar{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:4;
    align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
  #visio-minibar button{border:none;border-radius:999px;color:#fff;font-size:15px;cursor:pointer;width:36px;height:36px}
  @media(min-width:900px){ #visio.mini{width:268px;height:186px;bottom:16px} }
  .vbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid rgba(255,255,255,.12);color:#eaeef7}
  .vbar .btn.ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#eaeef7}
  .viewer iframe{flex:1;border:none;width:100%;background:#fff}
  #jitsi-box{flex:1}
  #jitsi-box iframe{width:100%;height:100%;border:none}
  .ring{position:fixed;inset:0;z-index:80;background:rgba(8,13,24,.97);display:none;align-items:center;justify-content:center;padding:24px;color:#eaeef7}
  .ring.open{display:flex}
  .ring-av{width:100px;height:100px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto}
  .ring-btn{width:66px;height:66px;border-radius:50%;border:none;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .ring-btn.accept{background:var(--pres)}
  .ring-btn.decline{background:#ef4444;transform:rotate(135deg)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));z-index:90;background:var(--card);border:1px solid var(--card-brd);color:var(--t1);padding:12px 16px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
  .toast.show{opacity:1}
  .meet{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--card-brd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:background .15s}
  .meet:hover{background:var(--hov)}
  .meet .cd{font-family:'Space Mono',monospace;font-size:13px;color:var(--pres);font-weight:700;flex-shrink:0}
  /* ── BARRE LATÉRALE BUREAU (tablette et ordinateur, ≥768px) — pilules de navigation.
     Un téléphone tenu en travers reste en mobile grâce au garde-fou de hauteur. ── */
  #dskside{display:none;width:284px;flex-shrink:0;background:var(--sd);color:var(--t1);border-right:1px solid var(--brd);flex-direction:column;padding:20px 14px 18px;overflow-y:auto;position:relative;z-index:40}
  .dsk-lbl{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--lbl);text-transform:uppercase;padding:14px 14px 8px}
  .dsk-item{display:flex;align-items:center;padding:15px 22px;border-radius:999px;background:var(--pill-bg);border:1px solid var(--pill-brd);margin-bottom:9px;font-size:15px;font-weight:700;color:var(--t1);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
  .dsk-item:hover{border-color:var(--pill-brd-h);background:var(--pill-bg-h)}
  .dsk-item.on{background:var(--pill-on-bg);border-color:var(--pill-on-brd);color:var(--pill-on-tx)}
  .dsk-item .dbadge,.dsk-chan .dbadge{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--badge-bg);color:var(--badge-tx);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;font-style:normal}
  .dsk-chan{display:flex;flex-direction:column;gap:2px;padding:13px 20px;border-radius:999px;background:var(--pill-bg);border:1px solid var(--pill-brd);margin-bottom:8px;cursor:pointer;position:relative;transition:background .2s,border-color .2s}
  .dsk-chan b{font-size:14px;color:var(--t1);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dsk-chan span{font-size:10.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;display:block}
  .dsk-chan:hover{border-color:var(--pill-brd-h);background:var(--pill-bg-h)}
  .dsk-chan.on{background:var(--pill-on-bg);border-color:var(--pill-on-brd)}
  .dsk-chan.on b{color:var(--pill-on-tx)}
  .dsk-chan .dbadge{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
  .dsk-suite{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:11px;margin-bottom:6px;cursor:pointer;text-decoration:none;color:var(--t1);font-size:12px;font-weight:700;letter-spacing:.07em;transition:background .2s}
  .dsk-suite:hover{background:var(--pill-bg-h)}
  .dsk-suite.here{background:var(--tint2)}
  .dsk-user{display:flex;align-items:center;gap:11px;padding:14px 11px 2px;border-top:1px solid var(--brd);margin-top:12px;cursor:pointer}
  .maincol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  /* sur grand écran, la liste des discussions ne reste plus seule au milieu
     d'une page vide : un panneau à droite donne la journée en cours */
  #disc-side{display:none}
  /* Deux états sur grand écran :
     — rien d'ouvert : la liste est large et centrée ;
     — une discussion ouverte : elle se resserre à gauche et la conversation
       prend la droite, comme sur WhatsApp. */
  @media(min-width:1000px) and (min-height:500px){
    .view.discview{max-width:1120px}
    .view.discview.cote{max-width:none;margin:0}
    .view.discview.cote .disc-2col{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:0;align-items:start}
    .view.discview.cote .view-h h2{font-size:26px}

  .row.ouverte{background:var(--tint2)!important}
  .side-c{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;padding:13px 15px;margin-bottom:12px}
  .side-t{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--t3);text-transform:uppercase;margin-bottom:9px}
  .side-l{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--sep);font-size:13px}
  .side-l:first-of-type{border-top:none}
  @media(min-width:768px) and (min-height:500px){
    #root{flex-direction:row}
    #dskside{display:flex}
    .maincol .nav{display:none}
    .chat{left:284px}
    /* les fenêtres ne recouvrent JAMAIS la barre latérale : la navigation
       reste cliquable du premier coup, même quand une fenêtre est ouverte.
       Et sur ordinateur, la fenêtre s'ouvre au milieu de l'écran. */
    .sheet{left:284px;align-items:center;justify-content:center;padding:26px}
    .sheet-c{max-width:600px;max-height:84vh;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .sheet.open .sheet-c{animation:shPop .17s ease-out}

<script>
  /* ── 🗼 Tour de contrôle : sentinelle technique (bugs, lenteurs, réseau) — isolée, aucune donnée métier,
        désactivable via localStorage 'top_monitor_off'. Ne doit JAMAIS faire planter l'application. ── */
  (function(){
  try{ if(localStorage.getItem('top_monitor_off')==='1') return; }catch(_){ }
  var TM_APP='opmessages', TM_KEY='top_monitor_q', TM_URL='https://api.teamop.fr/api/monitor/report';
  var tmLastSend=0, tmSending=false, tmT=Date.now();
  function tmCat(){ return 'Messages'; }
  function tmVer(){ try{ return String(typeof APP_VERSION!=='undefined'?APP_VERSION:''); }catch(_){ return ''; } }
  function tmEnt(){ var nom='',email='';
    try{ if(typeof COMP!=='undefined'&&COMP&&COMP.name) nom=String(COMP.name).trim(); }catch(_){ }
    try{ if(typeof USER!=='undefined'&&USER&&USER.email) email=String(USER.email).trim(); }catch(_){ }
    return {nom:nom||'inconnue',email:email}; }
  function tmUA(){ try{ var u=navigator.userAgent||'', ap=/iPhone|iPad|iPod/i.test(u)?'iPhone':(/Android/i.test(u)?'Android':'PC'), nv=/Edg\//.test(u)?'Edge':(/OPR\//.test(u)?'Opera':(/Chrome\//.test(u)?'Chrome':(/Firefox\//.test(u)?'Firefox':(/Safari\//.test(u)?'Safari':'Navigateur')))); return ap+' · '+nv; }catch(_){ return '?'; } }
  function tmLoad(){ try{ var q=JSON.parse(localStorage.getItem(TM_KEY)||'[]'); return Array.isArray(q)?q:[]; }catch(_){ return []; } }
  function tmSaveQ(q){ try{ localStorage.setItem(TM_KEY,JSON.stringify(q.slice(-40))); }catch(_){ } }
  function tmPush(type,message,stack,src,line){ try{
    message=String(message||'').slice(0,300); if(!message) return;
    if(/ResizeObserver|^Script error/i.test(message)) return;
    if(/extension:\/\//.test(String(src||''))) return;
    var sig=type+'|'+message.slice(0,120)+'|'+(line||0);
    var q=tmLoad(), e=null;
    for(var i=0;i<q.length;i++){ if(q[i].signature===sig){ e=q[i]; break; } }
    if(e){ e.count=(e.count||1)+1; }
    else{ var ent=tmEnt(); q.push({signature:sig,app:TM_APP,version:tmVer(),categorie:tmCat(),type:type,message:message,stack:String(stack||'').slice(0,600),src:String(src||'').slice(0,200),line:line||0,entreprise:ent.nom,email:ent.email,appareil:tmUA(),count:1,ts:Date.now()}); }
    tmSaveQ(q); setTimeout(tmFlush,500);
  }catch(_){ } }
  function tmFlush(){ try{
    if(tmSending) return;
    var now=Date.now(); if(now-tmLastSend<30000) return;
    var q=tmLoad(); if(!q.length) return;
    tmLastSend=now;
    var payload=JSON.stringify({reports:q.slice(0,40)}), ok=false;
    try{ if(navigator.sendBeacon) ok=navigator.sendBeacon(TM_URL,new Blob([payload],{type:'text/plain'})); }catch(_){ ok=false; }
    if(ok){ tmSaveQ([]); return; }
    if(!window.fetch) return;
    tmSending=true;
    fetch(TM_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).then(function(r){ tmSending=false; if(r&&r.ok) tmSaveQ([]); },function(){ tmSending=false; });
  }catch(_){ tmSending=false; } }
  window.addEventListener('error',function(e){ try{ tmPush('erreur',e&&e.message,e&&e.error&&e.error.stack,e&&e.filename,e&&e.lineno); }catch(_){ } });
  window.addEventListener('unhandledrejection',function(e){ try{ var r=(e&&e.reason)||{}; var m=String((r&&r.message)||r||''); if(/Failed to fetch|NetworkError|Load failed|network connection was lost|annulé/i.test(m)) return; tmPush('erreur','Promesse rejetée : '+m,r&&r.stack,'',0); }catch(_){ } });
  try{
    if(window.PerformanceObserver&&PerformanceObserver.supportedEntryTypes&&PerformanceObserver.supportedEntryTypes.indexOf('longtask')>=0){
      new PerformanceObserver(function(l){ try{ l.getEntries().forEach(function(en){ if(en.duration>2000) tmPush('lenteur','Interface bloquée pendant '+Math.round(en.duration)+' ms','','',0); }); }catch(_){ } }).observe({entryTypes:['longtask']});
    } else if(window.requestAnimationFrame){
      var tmTick=function(){ try{ var n=Date.now(); if(n-tmT>2000&&document.visibilityState==='visible') tmPush('lenteur','Interface figée pendant '+(n-tmT)+' ms','','',0); tmT=n; }catch(_){ } requestAnimationFrame(tmTick); };
      requestAnimationFrame(tmTick);
    }
  }catch(_){ }
  try{
    var tmF=window.fetch;
    if(tmF) window.fetch=function(input){ var url=''; try{ url=(typeof input==='string')?input:((input&&input.url)||''); }catch(_){ }
      var p=tmF.apply(window,arguments);
      try{
        /* on ne surveille QUE les appels dont l'échec gêne vraiment l'utilisateur.
           Les appels « au mieux » (notifications, synchro, vigie) échouent sans conséquence
           — typiquement pendant un redémarrage du serveur — et ne doivent pas polluer la surveillance. */
        var TM_HORS=/\/api\/(monitor|subscribe|unsubscribe|notify|bug|vapid|clients\/sync)/;
        if(/api\.teamop\.fr/.test(url)&&!TM_HORS.test(url)){ var ep=url.replace(/^https?:\/\/[^\/]+/,'').split('?')[0];
          /* un échec isolé (serveur qui redémarre, wifi qui saute) n'est pas un incident :
             on ne le signale qu'à la 2e fois en moins de 3 minutes sur le même appel. */
          var tmRet=function(msg){ try{
            window.__tmNet=window.__tmNet||{};
            var n=Date.now(), pre=window.__tmNet[ep]||0;
            window.__tmNet[ep]=n;
            if(n-pre<180000) tmPush('reseau',msg,'','',0);
          }catch(_){ } };
          p.then(function(r){ try{ if(r&&r.status>=500) tmRet('api.teamop.fr a répondu '+r.status+' sur '+ep); }catch(_){ } },
                 function(err){ try{ tmRet('api.teamop.fr injoignable sur '+ep+' ('+String((err&&err.message)||'échec').slice(0,80)+')'); }catch(_){ } });
        } }catch(_){ }
      return p; };
  }catch(_){ }
  try{ document.addEventListener('visibilitychange',function(){ tmT=Date.now(); if(document.visibilityState==='hidden') tmFlush(); }); }catch(_){ }
  try{ setInterval(tmFlush,35000); setTimeout(tmFlush,4000); }catch(_){ }
  })();
</script>

     Le réglage est partagé avec le service de notifications par une petite

  function silenceLire(){ try{ return JSON.parse(localStorage.getItem('opmsg_silence')||'null')||{on:false,de:'20:00',a:'07:00'}; }catch(e){ return {on:false,de:'20:00',a:'07:00'}; } }

      o.onsuccess=e=>{ const db=e.target.result; try{ db.transaction('prefs','readwrite').objectStore('prefs').put(v,'silence'); }catch(_){}} ;
    }catch(e){}

  function silenceActif(v){ v=v||silenceLire(); if(!v.on) return false;

    return de<=a ? (m>=de&&m<a) : (m>=de||m<a); }

  // Icône Material Symbols Rounded (nouveaux éléments du design)
  /* On dessine l'icône nous-mêmes dès qu'on l'a ; sinon, l'ancienne police
     prend le relais — rien ne peut disparaître de l'écran. */
  function ms(n,sz,fill){
    if(ICON[n]) return `<svg viewBox="0 0 24 24" width="${sz||20}" height="${sz||20}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-.16em;flex-shrink:0">${ICON[n]}</svg>`;
    return `<span class="ms${fill?' f1':''}" style="font-size:${sz||20}px">${n}</span>`;
  }

  /* Certaines icônes sont écrites en dur dans la page. On les remplace elles
     aussi par nos dessins, au fil de l'affichage : rien ne dépend plus d'un
     serveur extérieur. */
  function _msMaison(racine){
    let l; try{ l=(racine||document).querySelectorAll('span.ms'); }catch(e){ return; }
    if(!l||!l.length) return;
    l.forEach(e=>{
      const n=(e.textContent||'').trim(); if(!ICON[n]) return;
      let sz=20; try{ sz=Math.round(parseFloat(getComputedStyle(e).fontSize))||20; }catch(_){}
      e.innerHTML=`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block">${ICON[n]}</svg>`;
      e.classList.remove('ms'); e.style.display='inline-flex'; e.style.alignItems='center';
    });
  }
  try{
    let _msT=null;
    const _msObs=new MutationObserver(()=>{ if(_msT) return; _msT=requestAnimationFrame(()=>{ _msT=null; _msMaison(); }); });
    _msObs.observe(document.documentElement,{childList:true,subtree:true});
    _msMaison();
  }catch(e){}

    const stat=(cle,icn,val,lbl,amber,pied)=>`<div class="card dstat" onclick="dashStat('${cle}')" title="Clique pour voir le détail"

    let grid='';
