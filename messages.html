          <span style="margin-left:8px;min-width:20px;height:20px;border-radius:999px;background:var(--badge-bg);color:var(--badge-tx);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px">${r.total>99?'99+':r.total}</span>
          <span style="flex:1"></span>
          <span style="font-size:11px;font-weight:700;color:var(--tile-tx);cursor:pointer" onclick="showView('disc')">Tout voir</span></div>
        ${lignes}
        ${r.liste.length>8?`<div style="padding:9px 15px;font-size:11px;color:var(--t3);text-align:center;border-top:1px solid var(--sep)">+ ${r.liste.length-8} autre${r.liste.length-8>1?'s':''}</div>`:''}</div>`;
    })();
  }

  /* ══════════════════════════════════════════════════════════════════════
     DEUX RÉUNIONS À LA MÊME HEURE SE RANGENT CÔTE À CÔTE
     ══════════════════════════════════════════════════════════════════════ */
  function dashCotes(list){
    const lane=[], n=[];
    const finDe=r=>r.scheduledAt+dureeDe(r)*60000;   // sa vraie fin, pas une durée moyenne
    let i=0;
    while(i<list.length){
      let j=i, fin=finDe(list[i]);
      while(j+1<list.length && list[j+1].scheduledAt<fin){ j++; fin=Math.max(fin,finDe(list[j])); }
      const nb=j-i+1;
      for(let k=i;k<=j;k++){ lane[k]=k-i; n[k]=nb; }
      i=j+1;
    }
    return {lane:lane,n:n};
  }

  /* ══════════════════════════════════════════════════════════════════════
     DÉPLACER UNE RÉUNION EN LA FAISANT GLISSER
     On attrape le bloc, on le lâche dans une autre case : le jour et l'heure
     changent, la minute suit l'endroit où on lâche (au pas de 5 minutes).
     ══════════════════════════════════════════════════════════════════════ */
  /* On presse le carré, on le tire, on le lâche sur une case — le carré suit
     la souris (ou le doigt), la case visée s'allume. Un simple clic sans tirer
     ouvre la fenêtre de la réunion, comme avant. */
  let _pd=null;
  function planPresse(ev,el,id){
    const r=_dashRooms[id]; if(!peutBouger(r)) return;
    if(ev.button!==undefined&&ev.button!==0&&ev.pointerType==='mouse') return;
    _pd={id:id,el:el,x0:ev.clientX,y0:ev.clientY,actif:false,survole:null};
  }
  document.addEventListener('pointermove',ev=>{
    if(!_pd) return;
    const dx=ev.clientX-_pd.x0, dy=ev.clientY-_pd.y0;
    if(!_pd.actif){
      if(Math.hypot(dx,dy)<6) return;                 /* en dessous, c'est un clic */
      _pd.actif=true; try{ dashHovHide(); }catch(e){}
      const c=$('dash-cal'); if(c) c.classList.add('deplace');
      _pd.el.classList.add('attrape');
    }
    _pd.el.style.transform='translate('+dx+'px,'+dy+'px)';
    const sous=document.elementFromPoint(ev.clientX,ev.clientY);
    const cell=sous&&sous.closest?sous.closest('[data-jr]'):null;
    if(_pd.survole&&_pd.survole!==cell) _pd.survole.classList.remove('survol-depot');
    if(cell) cell.classList.add('survol-depot');
    _pd.survole=cell;
    /* la bulle : on voit la minute exacte avant de lâcher */
    let bulle=$('tirehov'); if(!bulle){ bulle=document.createElement('div'); bulle.id='tirehov'; document.body.appendChild(bulle); }
    if(cell){
      const hc=cell.getAttribute('data-hc'); let lib='';
      if(hc===''){ const r0=_dashRooms[_pd.id], d0=r0?new Date(r0.scheduledAt):null;
        const jr=new Date(cell.getAttribute('data-jr')+'T00:00:00');
        lib=jr.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})+(d0?' · '+String(d0.getHours()).padStart(2,'0')+':'+String(d0.getMinutes()).padStart(2,'0'):'');
      } else {
        const b=cell.getBoundingClientRect();
        const y=Math.max(0,Math.min(b.height,ev.clientY-b.top));
        const min=Math.min(55,Math.round((y/b.height)*12)*5);
        lib=String(parseInt(hc,10)).padStart(2,'0')+':'+String(min).padStart(2,'0');
      }
      bulle.textContent=lib; bulle.style.display='block';
      bulle.style.left=(ev.clientX+14)+'px'; bulle.style.top=(ev.clientY-36)+'px';
    } else bulle.style.display='none';
    ev.preventDefault();
  },{passive:false});
  document.addEventListener('pointerup',async ev=>{
    if(!_pd) return;
    const pd=_pd; _pd=null;
    const c=$('dash-cal'); if(c) c.classList.remove('deplace');
    pd.el.classList.remove('attrape'); pd.el.style.transform='';
    if(pd.survole) pd.survole.classList.remove('survol-depot');
    try{ const bl=$('tirehov'); if(bl) bl.style.display='none'; }catch(e){}
    if(!pd.actif) return;                              /* simple clic : la fenêtre s'ouvre normalement */
    /* on avale le clic qui suit le lâcher, sinon la fenêtre de la réunion s'ouvrirait */
    const avale=e=>{ e.stopPropagation(); e.preventDefault(); window.removeEventListener('click',avale,true); };
    window.addEventListener('click',avale,true);
    setTimeout(()=>{ try{ window.removeEventListener('click',avale,true); }catch(e){} },350);
    const sous=document.elementFromPoint(ev.clientX,ev.clientY);
    const cell=sous&&sous.closest?sous.closest('[data-jr]'):null;
    if(!cell){ toast('Lâche la réunion sur une case du calendrier'); return; }
    const dateISO=cell.getAttribute('data-jr'), hc=cell.getAttribute('data-hc');
    let heure, min;
    if(hc===''){                                       /* vue mois : on garde l'heure d'origine */
      const r0=_dashRooms[pd.id], d0=r0?new Date(r0.scheduledAt):null;
      heure=d0?d0.getHours():9; min=d0?d0.getMinutes():0;
    } else {
      heure=parseInt(hc,10)||0;
      const b=cell.getBoundingClientRect();
      const y=Math.max(0,Math.min(b.height,ev.clientY-b.top));
      min=Math.min(55,Math.round((y/b.height)*12)*5);  /* au pas de 5 minutes */
    }
    await reunionDeplace(pd.id,dateISO,heure,min);
  });
  document.addEventListener('pointercancel',()=>{
    if(!_pd) return; const pd=_pd; _pd=null;
    const c=$('dash-cal'); if(c) c.classList.remove('deplace');
    pd.el.classList.remove('attrape'); pd.el.style.transform='';
    if(pd.survole) pd.survole.classList.remove('survol-depot');
    try{ const bl=$('tirehov'); if(bl) bl.style.display='none'; }catch(e){}
  });
  /* ══ DÉPLACER EN DEUX CLICS ══
     Le glisser à la souris ne marche pas partout (et jamais au doigt sur
     téléphone). Alors : « Déplacer » dans la fenêtre de la réunion, puis un
     clic sur la case d'arrivée. Échap ou un nouvel appui annule. */
  let _moveId=null;
  function deplacerMode(id){
    try{ closeSheet(); }catch(e){}
    _moveId=id; const c=$('dash-cal'); if(c) c.classList.add('deplace');
    const r=_dashRooms[id];
    toast('Choisis la nouvelle case pour « '+((r&&r.name)||'la réunion')+' » — Échap pour annuler');
  }
  function deplacerFin(){ _moveId=null; const c=$('dash-cal'); if(c) c.classList.remove('deplace'); }
  async function planCaseClic(ev,el,dateISO,h){
    if(!_moveId){ dashForm(dateISO,(h===null||h===undefined)?'09:00':String(h).padStart(2,'0')+':00'); return; }
    const id=_moveId; deplacerFin();
    let heure=h, min=0;
    if(h===null||h===undefined){                      /* vue mois : on garde l'heure d'origine */
      const r0=_dashRooms[id], d0=r0?new Date(r0.scheduledAt):null;
      heure=d0?d0.getHours():9; min=d0?d0.getMinutes():0;
    } else {
      const b=el.getBoundingClientRect();
      const y=Math.max(0,Math.min(b.height,((ev&&ev.clientY)||0)-b.top));
      min=Math.min(55,Math.round((y/b.height)*12)*5);  /* la minute suit la hauteur du clic */
    }
    await reunionDeplace(id,dateISO,heure,min);
  }
  /* le déplacement : les règles n'autorisent pas de modifier une réunion sur
     place, on la recrée au nouvel horaire et on prévient tout le monde. */
  async function reunionDeplace(id,dateISO,h,m){
    if(!peutReunion()){ refusReunion(); return; }
    const col=roomCol();
    let r=null; try{ const d=await col.doc(id).get(); r={id:d.id,...(d.data()||{})}; }catch(e){}
    if(!r||!r.scheduledAt){ toast('Réunion introuvable'); return; }
    const quand=new Date(dateISO+'T00:00:00'); quand.setHours(h,m,0,0);
    const t=quand.getTime();
    if(t===r.scheduledAt) return;
    const d={name:r.name||'',desc:r.desc||'',duree:dureeDe(r),createdBy:r.createdBy||ME.uid,
             members:r.members||[ME.uid],createdAt:FV(),scheduledAt:t};
    if(r.serie){ d.serie=r.serie; d.repet=r.repet||''; }
    try{ await col.add(d); }
    catch(e){ opAlerte('Impossible de déplacer la réunion : '+(e.message||e)); return; }
    try{ await col.doc(id).delete(); }catch(e){}
    await reunionPrevenir(r.members||[], `${(USER&&USER.name)||'L’organisateur'} a déplacé « ${r.name||'la réunion'} » : maintenant ${reunionQuand(t)}. Merci de reconfirmer ta présence.`, 'Réunion déplacée');
    toast('Réunion déplacée au '+reunionQuand(t)+' — les participants sont prévenus');
    if(_curView==='dash') viewDash();
  }

  /* ══════════════════════════════════════════════════════════════════════
     LA CARTE D'INFORMATION AU SURVOL D'UNE RÉUNION
     ══════════════════════════════════════════════════════════════════════ */
  let _dashRooms={};
  /* en un mot : à venir, imminente, en cours, ou déjà passée */
  function dashEtat(diff){
    if(diff>15*60000) return 'à venir';
    if(diff>0) return 'dans '+Math.max(1,Math.round(diff/60000))+' min';
    if(diff>-2*3600000) return 'en cours';
    return 'passée';
  }
  function dashHovEl(){
    let el=$('dashhov');
    if(!el){ el=document.createElement('div'); el.id='dashhov'; document.body.appendChild(el); }
    return el;
  }
  function dashHovShow(ev,id){
    /* uniquement à la souris : au doigt (téléphone, tablette), la carte
       n'avait aucun moyen de se refermer et restait collée à l'écran */
    try{ if(!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return; }catch(e){}
    const r=_dashRooms[id]; if(!r) return;
    const el=dashHovEl();
    const n=(r.members||[]).length, o=rsvpResume(r);
    const diff=r.scheduledAt-Date.now();
    const etat=dashEtat(diff);
    const lg=(c,l,v)=>v?`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin-top:4px">
        <i style="width:7px;height:7px;border-radius:50%;background:${c};display:inline-block;flex:none"></i>
        <span style="color:var(--t2)">${l}</span><b style="margin-left:auto">${v}</b></div>`:'';
    const rep=(REPETS.find(x=>x[0]===r.repet)||[])[1];
    el.innerHTML=`<div style="font-size:13.5px;font-weight:800;line-height:1.3">${esc(r.name||'Réunion')}</div>
      <div style="font-size:11.5px;color:var(--t2);margin-top:3px">${esc(fmtWhen(r.scheduledAt))} → ${esc(heureFin(r))}</div>
      <div style="font-size:11.5px;color:var(--t2);margin-top:2px">${esc(dureeTexte(dureeDe(r)))} · ${etat}</div>
      ${r.desc?`<div style="font-size:11.5px;color:var(--t1);margin-top:7px;line-height:1.45">${esc(String(r.desc).slice(0,200))}${String(r.desc).length>200?'…':''}</div>`:''}
      ${(r.serie&&rep)?`<div style="font-size:11px;color:var(--t3);margin-top:5px">${esc(rep)}</div>`:''}
      <div style="height:1px;background:var(--sep);margin:9px 0"></div>
      <div style="font-size:11.5px;font-weight:700">${n} participant${n>1?'s':''}</div>
      ${n>1?lg('var(--pres)','Présent',o.oui)+lg('var(--amber)','En retard',o.retard)+lg('var(--red)','Absent',o.non)+lg('var(--off)','Sans réponse',o.sans):''}
      <div style="font-size:10.5px;color:var(--t3);margin-top:9px">Clique pour répondre ou voir le détail</div>`;
    el.classList.add('on');
    dashHovMove(ev);
  }
  function dashHovMove(ev){
    const el=$('dashhov'); if(!el||!el.classList.contains('on')) return;
    const w=el.offsetWidth||286, h=el.offsetHeight||140;
    let x=(ev.clientX||0)+16, y=(ev.clientY||0)+14;
    if(x+w>window.innerWidth-10) x=Math.max(10,(ev.clientX||0)-w-16);
    if(y+h>window.innerHeight-10) y=Math.max(10,window.innerHeight-h-10);
    el.style.left=x+'px'; el.style.top=y+'px';
  }
  function dashHovHide(){ const el=$('dashhov'); if(el) el.classList.remove('on'); }

  /* ══════════════════════════════════════════════════════════════════════
     LES TROIS CARTES DU HAUT S'OUVRENT SUR LEUR DÉTAIL
     ══════════════════════════════════════════════════════════════════════ */
  let _dashData={rooms:[],jour:[],avenir:[],convoques:[]};
  async function dashNoms(){
    const m={};
    try{
      if(MODE==='perso'){ (await listMembers()).forEach(x=>{ m[x.uid]=x.name||''; }); }
      else { const qs=await fs.collection('op_companies').doc(COMP.id).collection('members').get();
             qs.forEach(d=>{ m[d.id]=(d.data()||{}).name||''; }); }
    }catch(e){}
    return m;
  }
  function dashLigneReunion(r){
    const n=(r.members||[]).length, o=rsvpResume(r);
    const diff=r.scheduledAt-Date.now(), soon=diff>0&&diff<=15*60000, passe=diff<=0;
    const bg=passe?'var(--blk-green)':(soon?'var(--amber-bg)':'var(--tile-bg)');
    const col=passe?'var(--blk-green-tx)':(soon?'var(--amber)':'var(--tile-tx)');
    const icn=passe?ms('check_circle',17):(soon?ms('notifications_active',17,1):ms('schedule',17));
    const when=(passe?dashEtat(diff):(soon?('dans '+Math.max(1,Math.round(diff/60000))+' min'):esc(reunionQuand(r.scheduledAt))))
              +' · '+dureeTexte(dureeDe(r));
    const det=n>1?[o.oui?o.oui+' présent'+(o.oui>1?'s':''):'',o.retard?o.retard+' en retard':'',
                   o.non?o.non+' absent'+(o.non>1?'s':''):'',o.sans?o.sans+' sans réponse':''].filter(Boolean).join(' · ')
                :'Alerte 15 min avant dans OP Messages';
    return `<div onclick="closeSheet();setTimeout(function(){rsvpOuvre('${r.id}')},120)"
        style="display:flex;gap:11px;padding:11px 2px;border-top:1px solid var(--sep);cursor:pointer">
      <div style="width:34px;height:34px;flex:none;border-radius:10px;background:${bg};color:${col};display:flex;align-items:center;justify-content:center">${icn}</div>
      <div style="min-width:0;flex:1">
        <div style="font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name||'Réunion')} — ${when}</div>
        <div style="font-size:11px;color:var(--t2);margin-top:2px">${esc(det)}</div>
        ${r.desc?`<div style="font-size:11px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(String(r.desc).slice(0,90))}</div>`:''}
      </div>
      <span class="ms" style="font-size:18px;color:var(--t3);flex:none;align-self:center">chevron_right</span></div>`;
  }
  async function dashStat(cle){
    dashHovHide();
    const D=_dashData, titre=$_titreStat(cle);
    const vide=t=>`<p class="muted" style="font-size:12.5px;padding:14px 0 2px;text-align:center">${t}</p>`;
    openSheet(`<h3 style="font-family:'Space Mono',monospace;font-size:16px;margin-bottom:4px">${titre}</h3>
      <div id="dstat-c"><p class="muted" style="font-size:12.5px">Un instant…</p></div>`);
    const z=()=>$('dstat-c');
    if(cle==='jour'){
      const l=(D.jour||[]).slice().sort((a,b)=>a.scheduledAt-b.scheduledAt);
      if(!z()) return;
      z().innerHTML=`<div style="font-size:11.5px;color:var(--t2);margin-bottom:6px">${l.length?(l.length+' réunion'+(l.length>1?'s':'')+' aujourd’hui'):''}</div>`
        +(l.length?l.map(dashLigneReunion).join(''):vide('Rien de prévu aujourd’hui.'));
      return;
    }
    if(cle==='alerte'){
      const l=(D.avenir||[]).slice(0,12);
      if(!z()) return;
      z().innerHTML=`<div style="font-size:11.5px;color:var(--t2);margin-bottom:6px">Chacun reçoit une alerte 15 minutes avant, dans OP Messages.</div>`
        +(l.length?l.map(dashLigneReunion).join('')
          +((D.avenir||[]).length>12?`<div style="font-size:11px;color:var(--t3);text-align:center;padding:9px 0;border-top:1px solid var(--sep)">+ ${(D.avenir||[]).length-12} autre${(D.avenir||[]).length-12>1?'s':''}</div>`:'')
          :vide('Aucune réunion planifiée à venir.'));
      return;
    }
    /* les participants convoqués */
    const noms=await dashNoms();
    if(!z()) return;
    const av=(D.avenir||[]).slice().sort((a,b)=>a.scheduledAt-b.scheduledAt);
    const lignes=(D.convoques||[]).map(u=>{
      const mes=av.filter(r=>(r.members||[]).indexOf(u)>=0);
      const proch=mes[0];
      const rep=proch?((proch.reponses||{})[u]||null):null;
      const et=rep&&RSVP[rep.etat]?RSVP[rep.etat]:null;
      const nm=noms[u]||(u===ME.uid?((USER&&USER.name)||'Moi'):'Participant');
      return {u:u,nm:nm,n:mes.length,proch:proch,et:et,rep:rep};
    }).sort((a,b)=>b.n-a.n||a.nm.localeCompare(b.nm));
    z().innerHTML=`<div style="font-size:11.5px;color:var(--t2);margin-bottom:6px">${lignes.length} personne${lignes.length>1?'s':''} attendue${lignes.length>1?'s':''} sur les réunions à venir.</div>`
      +(lignes.length?lignes.map(x=>`<div style="display:flex;align-items:center;gap:11px;padding:10px 2px;border-top:1px solid var(--sep)">
          <div class="ava" style="width:36px;height:36px;border-radius:50%;font-size:12px;flex:none;${avatarStyle(x.nm)}">${ini(x.nm)}</div>
          <div style="min-width:0;flex:1">
            <div style="font-size:12.8px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.nm)}${x.u===ME.uid?' <span style="font-weight:600;color:var(--t3)">(moi)</span>':''}</div>
            <div style="font-size:11px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.n} réunion${x.n>1?'s':''}${x.proch?' · '+esc(reunionQuand(x.proch.scheduledAt)):''}</div>
          </div>
          ${x.et?`<span style="flex:none;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:${x.et.bg};color:${x.et.c}">${x.et.l}${(x.rep&&x.rep.etat==='retard'&&x.rep.min)?' '+x.rep.min+'′':''}</span>`
                :`<span style="flex:none;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--sep);color:var(--t3)">sans réponse</span>`}
        </div>`).join('')
        :vide('Personne n’est convoqué pour le moment.'));
  }
  function $_titreStat(cle){
    if(cle==='jour') return 'Les réunions d’aujourd’hui';
    if(cle==='alerte') return 'Les alertes programmées';
    return 'Les participants convoqués';
  }
  /* ── Chercher dans tous les messages, pas seulement dans la discussion ouverte ── */
  let _rechQ='';
  function rechOuvre(){
    openSheet(`<h3 style="font-family:'Space Mono',monospace;font-size:16px;margin-bottom:10px">Rechercher</h3>
      <input id="rech-q" value="${esc(_rechQ)}" placeholder="Un mot, un nom, une adresse…" autocapitalize="off"
        oninput="clearTimeout(window._rechT);window._rechT=setTimeout(rechLance,320)"
        style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid transparent;background:var(--inp);font-size:13px;color:var(--t1);font-family:inherit;outline:none">
      <div style="font-size:10.7px;color:var(--t3);margin-top:7px">Cherche dans toutes tes discussions à la fois.</div>
      <div id="rech-res" style="margin-top:12px"></div>`);
    setTimeout(()=>{ const i=$('rech-q'); if(i) i.focus(); },80);
    if(_rechQ) rechLance();
  }
  async function rechLance(){
    const q=((($('rech-q')||{}).value)||'').trim().toLowerCase(); _rechQ=q;
    const z=$('rech-res'); if(!z) return;
    if(q.length<2){ z.innerHTML='<p class="muted" style="font-size:12px">Tape au moins deux lettres.</p>'; return; }
    z.innerHTML='<p class="muted center" style="font-size:12px">Recherche…</p>';
    const ch=chanCol(); const map={}, nmap={};
    try{
      if(MODE==='perso'){
        const [grp,mem]=await Promise.all([ ch.where('members','array-contains',ME.uid).get(), listMembers() ]);
        mem.forEach(m=>nmap[m.uid]=m.name||''); grp.forEach(d=>map[d.id]=d.data());
      } else {
        const [gen,grp,mem]=await Promise.all([ ch.where('type','==','general').get(),
          ch.where('members','array-contains',ME.uid).get(),
          fs.collection('op_companies').doc(COMP.id).collection('members').get() ]);
        mem.forEach(d=>nmap[d.id]=d.data().name||'');
        gen.forEach(d=>map[d.id]=d.data()); grp.forEach(d=>map[d.id]=d.data());
      }
    }catch(e){ z.innerHTML='<p class="muted" style="font-size:12px">Impossible de lire les discussions.</p>'; return; }
    const nomCh=(id,c)=>{ if(c.type==='general') return 'Général';
      if(c.type==='dm'){ const o=(c.members||[]).find(u=>u!==ME.uid); return nmap[o]||'Contact'; }
      return c.name||''; };
    const ids=Object.keys(map);
    const trouves=[];
    await Promise.all(ids.map(async id=>{
      try{ const qs=await ch.doc(id).collection('messages').orderBy('ts','desc').limit(300).get();
        qs.forEach(d=>{ const m=d.data(); const t=(m.text||'');
          if(t.toLowerCase().indexOf(q)>=0)
            trouves.push({ch:id, nomCh:nomCh(id,map[id]), id:d.id, m:m,
              ts:(m.ts&&m.ts.toDate)?m.ts.toDate().getTime():0}); });
      }catch(e){}
    }));
    trouves.sort((a,b)=>b.ts-a.ts);
    if(!trouves.length){ z.innerHTML=`<p class="muted" style="font-size:12px">Rien trouvé pour « ${esc(q)} ».</p>`; return; }
    const surligne=t=>{ const i=t.toLowerCase().indexOf(q); if(i<0) return esc(t.slice(0,110));
      const a=Math.max(0,i-40), av=(a?'…':'')+t.slice(a,i), mo=t.slice(i,i+q.length), ap=t.slice(i+q.length,i+q.length+60);
      return esc(av)+'<b style="background:rgba(94,130,255,.28);color:var(--op-l);border-radius:4px;padding:0 2px">'+esc(mo)+'</b>'+esc(ap)+(t.length>i+q.length+60?'…':''); };
    z.innerHTML=`<div style="font-size:10.7px;font-weight:800;letter-spacing:.06em;color:var(--t3);margin-bottom:4px">${trouves.length} RÉSULTAT${trouves.length>1?'S':''}</div>`
      +trouves.slice(0,40).map(x=>`<div onclick="rechAller('${esc(x.ch)}','${esc((x.nomCh||'').replace(/'/g,''))}','${esc(x.id)}')"
        style="padding:10px 0;border-top:1px solid var(--sep);cursor:pointer">
        <div style="display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t3)">
          <b style="color:var(--tile-tx);font-weight:800">${esc(x.nomCh)}</b>
          <span>${esc(x.m.name||'')}</span><span style="flex:1"></span>
          <span>${x.ts?esc(dashDepuis(x.ts)):''}</span></div>
        <div style="font-size:12.5px;margin-top:3px;line-height:1.45">${surligne(x.m.text||'')}</div></div>`).join('')
      +(trouves.length>40?`<div style="font-size:11px;color:var(--t3);text-align:center;padding:9px 0">+ ${trouves.length-40} autres — précise ta recherche</div>`:'');
  }
  function rechAller(chId,nom,msgId){
    closeSheet(); showView('disc');
    setTimeout(()=>{ try{ openChannel(chId,nom); setTimeout(()=>versMessage(msgId),900); }catch(e){} },140);
  }
  /* ── La colonne des nouveaux messages : uniquement ce qui n'est pas lu ── */
  async function dashNouveaux(){
    const ch=chanCol(); const map={}, nmap={};
    try{
      if(MODE==='perso'){
        const [grp,mem]=await Promise.all([ ch.where('members','array-contains',ME.uid).get(), listMembers() ]);
        mem.forEach(m=>nmap[m.uid]=m.name||''); grp.forEach(d=>map[d.id]=d.data());
      } else {
        const [gen,grp,mem]=await Promise.all([ ch.where('type','==','general').get(),
          ch.where('members','array-contains',ME.uid).get(),
          fs.collection('op_companies').doc(COMP.id).collection('members').get() ]);
        mem.forEach(d=>nmap[d.id]=d.data().name||'');
        gen.forEach(d=>map[d.id]=d.data()); grp.forEach(d=>map[d.id]=d.data());
      }
    }catch(e){ return {liste:[],total:0}; }
    const unreadOf=(id,c)=>{ let u=0;
      if(c.lastMsgFrom!==ME.uid){ u=Math.max(0,(c.msgCount||0)-getReadCount(id));
        if(!c.msgCount && c.lastMsgAt && c.lastMsgAt>getReadTs(id)) u=1; }
      if(!u&&_munread.has(ck(id))) u=1; return u; };
    const nom=(id,c)=>{ if(c.type==='general') return 'Général';
      if(c.type==='dm'){ const o=(c.members||[]).find(u=>u!==ME.uid); return nmap[o]||'Contact'; }
      return c.name||''; };
    const l=Object.entries(map)
      .filter(([id,c])=>{ if(c.type==='dm'){ const o=(c.members||[]).find(u=>u!==ME.uid); if(isBlocked(o)) return false; }
        const del=getDelAt(id); if(del&&(c.lastMsgAt||0)<=del) return false; return unreadOf(id,c)>0; })
      .map(([id,c])=>({id:id,c:c,n:unreadOf(id,c),nom:nom(id,c)}))
      .sort((a,b)=>(b.c.lastMsgAt||0)-(a.c.lastMsgAt||0));
    return {liste:l, total:l.reduce((t,x)=>t+x.n,0)};
  }
  function dashDepuis(ts){
    if(!ts) return '';
    const d=Math.max(0,Date.now()-ts), mn=Math.floor(d/60000);
    if(mn<1) return 'à l’instant'; if(mn<60) return 'il y a '+mn+' min';
    const h=Math.floor(mn/60); if(h<24) return 'il y a '+h+' h';
    const j=Math.floor(h/24); return j===1?'hier':'il y a '+j+' j';
  }
  function dashOuvreConv(id,nom){ try{ closeSheet(); }catch(e){}
    showView('disc'); setTimeout(()=>{ try{ openChannel(id,nom); }catch(e){} },120); }

  /* ══════════════════════════════════════════════════════════════════════
     LES RÉPONSES DES PARTICIPANTS — Présent · En retard · Absent
     Chacun répond en un geste ; l'organisateur est prévenu de CHAQUE réponse
     pour ne louper personne, et voit la liste complète dans une fenêtre.
     ══════════════════════════════════════════════════════════════════════ */
  const RSVP={oui:{l:'Présent',c:'var(--green)',bg:'rgba(52,199,123,.16)'},
              retard:{l:'En retard',c:'var(--amber)',bg:'var(--amber-bg)'},
              non:{l:'Absent',c:'var(--red)',bg:'rgba(224,82,82,.16)'}};
  function rsvpDe(r,uid){ return ((r&&r.reponses)||{})[uid]||null; }
  function rsvpResume(r){
    const mem=(r&&r.members)||[], rep=(r&&r.reponses)||{};
    const o={oui:0,retard:0,non:0,sans:0};
    mem.forEach(u=>{ const x=rep[u]; if(x&&o[x.etat]!==undefined) o[x.etat]++; else o.sans++; });
    return o;
  }
  /* la petite pastille de couleurs posée sur la réunion, dans le calendrier */
  /* le résumé des réponses, en ligne dans le sous-titre : il ne doit jamais
     ajouter de hauteur au bloc, sinon il déborde de la case */
  function rsvpPastille(r){
    const m=(r&&r.members)||[]; if(m.length<2) return '';
    const o=rsvpResume(r);
    if(o.oui===m.length) return ` · <span style="font-weight:800">tous là</span>`;
    const pt=(c,n)=>n?`<i style="width:5px;height:5px;border-radius:50%;background:${c};display:inline-block;vertical-align:1px;margin:0 2px 0 4px"></i>${n}`:'';
    const t=pt('#34C77B',o.oui)+pt('#E8A33D',o.retard)+pt('#E05252',o.non);
    if(!t) return o.sans?` · ${o.sans} sans réponse`:'';
    return ' ·'+t+(o.sans?`<span style="opacity:.7"> · ${o.sans} sans rép.</span>`:'');
  }
  /* enregistre ma réponse, puis prévient l'organisateur */
  function rsvpCol(id){ return fs.collection('op_companies').doc(COMP.id).collection('rooms').doc(id).collection('reponses'); }
  /* On lit les réponses d'une réunion (une par personne, un document chacun).
     Si le cloud refuse la lecture, on ne se tait PAS : on retient la raison
     (_rsvpErr) et on affiche quand même la réponse qu'on vient de donner,
     gardée en mémoire. Sans ça, on clique et il ne se passe rien à l'écran. */
  let _rsvpErr='', _rsvpLocal={};
  async function rsvpCharge(id){
    const out={}; _rsvpErr='';
    try{ const qs=await rsvpCol(id).get(); qs.forEach(d=>{ out[d.id]=d.data(); }); }
    catch(e){ _rsvpErr=(e&&(e.code||e.message))||'lecture refusée'; }
    const loc=_rsvpLocal[id];
    if(loc) Object.keys(loc).forEach(u=>{ if(!out[u]) out[u]=loc[u]; });
    return out;
  }
  /* Un bandeau rouge DANS la fenêtre : bien plus clair qu'une alerte,
     et il dit quoi faire au lieu de recracher le jargon du cloud. */
  function rsvpErrAffiche(msg){
    const z=$('rsvp-err');
    const perm=/permission|insufficient|denied/i.test(msg);
    const h=`<div style="margin:10px 0;padding:11px 13px;border-radius:11px;background:rgba(224,82,82,.14);border:1px solid var(--red)">
      <div style="font-size:12.5px;font-weight:800;color:var(--red)">${esc(msg)}</div>
      ${perm?`<div style="font-size:11.5px;color:var(--t2);margin-top:6px;line-height:1.5">Le cloud bloque les réponses aux réunions. Il faut ajouter l’autorisation dans les règles Firebase — dis-le-moi, je te donne la ligne exacte à coller.</div>`:''}</div>`;
    if(z) z.innerHTML=h; else toast(msg);
  }
  async function rsvpRepond(id,etat,min){
    let r=null; try{ const d=await fs.collection('op_companies').doc(COMP.id).collection('rooms').doc(id).get(); r=d.data()||{}; }
    catch(e){ toast('Réunion introuvable'); return; }
    const dejaLa=await rsvpCharge(id);
    const anc=dejaLa[ME.uid];
    const mot=(($('rsvp-mot')||{}).value||'').trim().slice(0,140);
    const ma={etat:etat,min:(etat==='retard'?(parseInt(min,10)||15):0),mot:mot,
              nom:(USER&&USER.name)||'',le:Date.now()};
    try{ await rsvpCol(id).doc(ME.uid).set(ma); }
    catch(e){ rsvpErrAffiche('Ta réponse n’a pas pu être enregistrée. '+((e&&(e.code||e.message))||'')); return; }
    _rsvpLocal[id]=Object.assign(_rsvpLocal[id]||{},{[ME.uid]:ma});   // on l'affiche même si la relecture est bloquée
    toast(anc?'Réponse modifiée':'Réponse enregistrée');
    const rep=Object.assign({},dejaLa); rep[ME.uid]=ma;
    rsvpPrevenir(id,Object.assign({},r,{reponses:rep}),etat,ma,!!anc);
    rsvpOuvre(id);
    if(_curView==='dash') viewDash();
  }
  /* l'alerte à l'organisateur — sur CHAQUE réponse, y compris les changements */
  async function rsvpPrevenir(id,r,etat,ma,estChangement){
    const org=r.createdBy; if(!org||org===ME.uid) return;
    const nom=(USER&&USER.name)||'Quelqu’un', titre=r.name||'la réunion';
    const quand=r.scheduledAt?fmtWhen(r.scheduledAt):'';
    /* plusieurs réponses coup sur coup : on regroupe pour ne pas noyer */
    const recentes=Object.values(r.reponses||{}).filter(x=>x&&x.le&&Date.now()-x.le<5*60000).length;
    let txt;
    if(recentes>=3){ const o=rsvpResume(r);
      txt=`${recentes} nouvelles réponses pour « ${titre} »${quand?' — '+quand:''} : ${o.oui} présent${o.oui>1?'s':''}, ${o.retard} en retard, ${o.non} absent${o.non>1?'s':''}${o.sans?', '+o.sans+' sans réponse':''}.`;
    } else {
      const dit=etat==='oui'?'sera présent'
              :etat==='non'?'sera absent'
              :'arrivera avec '+(ma.min||15)+' min de retard';
      txt=`${nom} ${dit} — « ${titre} »${quand?' · '+quand:''}${ma.mot?' — « '+ma.mot+' »':''}${estChangement?' (réponse modifiée)':''}`;
    }
    try{
      const pair=[ME.uid,org].sort(), dmId='dm_'+pair.join('_');
      const ref=chanCol().doc(dmId);
      const d=await ref.get(); if(!d.exists) await ref.set({type:'dm',members:pair,createdAt:FV()});
      await addMsgTo(dmId,{uid:ME.uid,name:(USER&&USER.name)||'',text:txt,ts:FV(),rsvp:true},true);
      try{ opPushNotifyUsers([org],'Réponse à ta réunion',txt); }catch(e){}
    }catch(e){}
  }
  /* relancer ceux qui n'ont pas répondu */
  async function rsvpRelance(id,uid){
    let r=null; try{ const d=await fs.collection('op_companies').doc(COMP.id).collection('rooms').doc(id).get(); r=d.data()||{}; }catch(e){ return; }
    const quand=r.scheduledAt?fmtWhen(r.scheduledAt):'';
    const txt=`${(USER&&USER.name)||'L’organisateur'} attend ta réponse pour « ${r.name||'la réunion'} »${quand?' · '+quand:''} — Présent, En retard ou Absent ?`;
    try{ const pair=[ME.uid,uid].sort(), dmId='dm_'+pair.join('_');
      const ref=chanCol().doc(dmId); const d=await ref.get(); if(!d.exists) await ref.set({type:'dm',members:pair,createdAt:FV()});
      await addMsgTo(dmId,{uid:ME.uid,name:(USER&&USER.name)||'',text:txt,ts:FV(),rsvp:true},true);
      try{ opPushNotifyUsers([uid],'Réponse attendue · '+((COMP&&COMP.name)||''),txt); }catch(e){}
      toast('Relance envoyée'); }catch(e){ toast('Impossible d’envoyer la relance'); }
  }
  async function rsvpRelanceTous(id){
    let r=null; try{ const d=await fs.collection('op_companies').doc(COMP.id).collection('rooms').doc(id).get(); r=d.data()||{}; }catch(e){ return; }
    const rep=await rsvpCharge(id); const sans=(r.members||[]).filter(u=>u!==ME.uid&&!rep[u]);
    if(!sans.length){ toast('Tout le monde a répondu'); return; }
    for(const u of sans){ await rsvpRelance(id,u); }
    toast(sans.length+' relance'+(sans.length>1?'s':'')+' envoyée'+(sans.length>1?'s':''));
  }
  function rsvpRetardChoix(id){
    const z=$('rsvp-retard'); if(!z) return;
    z.innerHTML=[5,10,15,30].map(m=>`<span onclick="rsvpRepond('${id}','retard',${m})" style="font-size:11.5px;font-weight:800;padding:7px 13px;border-radius:9px;border:1px solid var(--brd2);color:var(--amber);cursor:pointer">+${m} min</span>`).join('')
      +`<span onclick="rsvpRetardLibre('${id}')" style="font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:9px;color:var(--t2);cursor:pointer">autre…</span>`;
    z.style.display='flex';
  }
  async function rsvpRetardLibre(id){ const v=await opSaisie('Ils seront prévenus.','20',
    {titre:'Combien de minutes de retard ?',type:'number',chiffres:true,oui:'Prévenir'}); if(v===null) return;
    const m=parseInt(v,10); if(!m||m<1){ toast('Nombre invalide'); return; } rsvpRepond(id,'retard',m); }
  /* la fenêtre : ma réponse en haut, la liste de tout le monde en dessous */
  async function rsvpOuvre(id){
    openSheet('<p class="muted center">Chargement…</p>');
    let r=null; try{ const d=await fs.collection('op_companies').doc(COMP.id).collection('rooms').doc(id).get(); r={id:d.id,...(d.data()||{})}; }
    catch(e){ openSheet('<p class="muted center">Réunion introuvable.</p>'); return; }
    r.reponses=await rsvpCharge(id);
    let mem=[]; try{ mem=await listMembers(); }catch(e){}
    const nomDe=u=>{ const m=mem.find(x=>x.uid===u); return (m&&m.name)||(rsvpDe(r,u)||{}).nom||'—'; };
    const membres=(r.members||[]);
    const o=rsvpResume(r);
    const jeSuisDedans=membres.indexOf(ME.uid)>=0;
    const ma=rsvpDe(r,ME.uid);
    const quand=r.scheduledAt?fmtWhen(r.scheduledAt):'';
    const btn=(k,lib)=>{ const on=ma&&ma.etat===k; const c=RSVP[k].c;
      const clic=(k==='retard')?`rsvpRetardChoix('${id}')`:`rsvpRepond('${id}','${k}')`;
      return `<span onclick="${clic}" style="flex:1;text-align:center;font-size:12px;font-weight:800;padding:11px 6px;border-radius:11px;cursor:pointer;
        border:1.5px solid ${on?c:'var(--brd2)'};color:${on?c:'var(--t2)'};${on?'background:'+RSVP[k].bg:''}">${lib}${on&&k==='retard'&&ma.min?' +'+ma.min+' min':''}</span>`; };
    const ligne=u=>{ const x=rsvpDe(r,u), nm=nomDe(u), est=u===r.createdBy;
      const pil=x?`<span style="font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;background:${RSVP[x.etat].bg};color:${RSVP[x.etat].c}">${x.etat==='retard'?'+'+(x.min||15)+' min':RSVP[x.etat].l}</span>`
        :`<span style="font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;background:var(--inp);color:var(--t3)">Sans réponse</span>`;
      const sous=x?(x.mot?'« '+esc(x.mot)+' »':(x.le?'a répondu '+fmtWhen(x.le):'')):(est?'organisateur':'pas encore répondu');
      const rel=(!x&&u!==ME.uid&&r.createdBy===ME.uid)?`<span onclick="rsvpRelance('${id}','${esc(u)}')" style="font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:7px;border:1px solid var(--brd2);color:var(--t2);cursor:pointer;white-space:nowrap">Relancer</span>`:'';
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sep)">
        <div class="ava" style="width:32px;height:32px;border-radius:50%;font-size:11px;${avatarStyle(nm)}">${ini(nm)}</div>
        <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm)}${est?' <span style="font-size:10px;color:var(--t3);font-weight:600">· organisateur</span>':''}</div>
        ${sous?`<div style="font-size:10.7px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sous)}</div>`:''}</div>
        ${pil}${rel}</div>`; };
    const compte=(n,lib,c)=>`<div style="flex:1;text-align:center;padding:10px 6px"><div style="font-size:19px;font-weight:800;line-height:1;color:${c||'var(--t1)'}">${n}</div><div style="font-size:10.3px;color:var(--t3);font-weight:600;margin-top:3px">${lib}</div></div>`;
    const errLec=_rsvpErr;   // la lecture des réponses a-t-elle été refusée ?
    openSheet(`<div data-titre="${esc(r.name||'Réunion')}" style="margin-bottom:12px">
        <small style="font-size:12.5px;color:var(--t2);display:block">${esc(quand)} → ${esc(heureFin(r))}${membres.length?' · '+membres.length+' convoqué'+(membres.length>1?'s':''):''}</small>
        <small style="font-size:11.5px;color:var(--t3);display:block;margin-top:2px">Durée prévue : ${esc(dureeTexte(dureeDe(r)))}</small>
        ${r.desc?`<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--inp);font-size:12.3px;color:var(--t2);line-height:1.55;white-space:pre-wrap">${esc(r.desc)}</div>`:''}</div>
      <div id="rsvp-err">${errLec?`<div style="margin:0 0 10px;padding:11px 13px;border-radius:11px;background:rgba(224,82,82,.14);border:1px solid var(--red)">
        <div style="font-size:12.5px;font-weight:800;color:var(--red)">Les réponses ne peuvent pas être lues (${esc(errLec)})</div>
        <div style="font-size:11.5px;color:var(--t2);margin-top:6px;line-height:1.5">Ta réponse est bien envoyée, mais le cloud refuse de la relire : c’est pour ça que rien ne s’affiche. Il manque une autorisation dans les règles Firebase.</div></div>`:''}</div>
      ${jeSuisDedans?`<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--t2);margin-bottom:8px">TA RÉPONSE</div>
        <div style="display:flex;gap:8px">${btn('oui','Présent')}${btn('retard','En retard')}${btn('non','Absent')}</div>
        <div id="rsvp-retard" style="display:none;gap:7px;flex-wrap:wrap;margin-top:9px"></div>
        <input id="rsvp-mot" maxlength="140" value="${esc((ma&&ma.mot)||'')}" placeholder="Un mot pour l'organisateur (facultatif)…"
          style="width:100%;margin-top:9px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:var(--inp);font-size:12.5px;color:var(--t1);font-family:inherit;outline:none">
        <div style="font-size:10.7px;color:var(--t3);margin-top:7px;line-height:1.5">Écris ton mot avant de choisir : il part avec la réponse. Tu peux changer d'avis jusqu'au début.</div>`:''}
      <div style="display:flex;background:var(--inp);border-radius:12px;margin-top:${jeSuisDedans?'14':'0'}px">
        ${compte(o.oui,'présents','var(--green)')}${compte(o.retard,'en retard','var(--amber)')}${compte(o.non,'absents','var(--red)')}${compte(o.sans,'sans réponse')}</div>
      <div style="margin-top:6px">${membres.map(ligne).join('')||'<p class="muted" style="font-size:12px">Aucun participant.</p>'}</div>
      ${(r.createdBy===ME.uid&&o.sans>0)?`<button class="btn ghost block" style="margin-top:12px" onclick="rsvpRelanceTous('${id}')">${o.sans>1?'Relancer les '+o.sans+' personnes sans réponse':'Relancer la personne sans réponse'}</button>`:''}
      <div data-pied>
        ${r.createdBy===ME.uid?`<button class="btn ghost" onclick="reunionModifier('${id}')">Modifier</button>
        <button class="btn ghost" style="color:var(--red)" onclick="reunionAnnuler('${id}')">Annuler</button>`:''}
        <button class="btn" style="font-weight:800" onclick="closeSheet();joinRoom('${id}','${esc((r.name||'').replace(/'/g,''))}')">Rejoindre la réunion</button></div>`);
  }
  /* ── Modifier ou annuler une réunion, et prévenir tout le monde ── */
  function roomCol(){ return fs.collection('op_companies').doc(COMP.id).collection('rooms'); }
  /* On prévient les participants de DEUX façons : une trace écrite dans leur
     conversation privée, et une notification sur leur téléphone — même quand
     OP MESSAGES est fermée. Le titre dit de quoi il s'agit. */
  async function reunionPrevenir(membres,texte,titre){
    const dest=(membres||[]).filter(u=>u&&u!==ME.uid);
    if(!dest.length) return;
    for(const u of dest){
      try{ const pair=[ME.uid,u].sort(), dmId='dm_'+pair.join('_');
        const ref=chanCol().doc(dmId); const d=await ref.get();
        if(!d.exists) await ref.set({type:'dm',members:pair,createdAt:FV()});

        <div style="display:flex;align-items:center;gap:8px"><span class="ms f1" style="font-size:17px;color:var(--tile-tx)">notifications_active</span><span style="font-size:12.5px;font-weight:700">Alerter les participants</span></div>
        <div id="dp-toggle" style="width:38px;height:22px;border-radius:999px;background:var(--green);position:relative;flex-shrink:0;transition:background .15s"><div style="position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s"></div></div>

    setTimeout(()=>{ dcLabel(); try{ dashRepetMaj(); }catch(e){} try{ dashDureeMaj(); }catch(e){}

      try{ dpPartRender(); }catch(e){}

  /* ══ CHOISIR LES PARTICIPANTS ══
     Une barre de recherche, la liste des collègues avec leur nom en clair,
     et les personnes retenues rappelées en haut. Utilisable à 3 comme à 60. */
  let _dpMem=[], _dpQ='', _dpOuvert=false;
  function dpPartBascule(){ _dpOuvert=!_dpOuvert; dpPartRender();
    if(_dpOuvert) setTimeout(()=>{ const i=$('dp-q'); if(i) i.focus(); },60); }
  function dpNorm(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function dpPartRech(v){ _dpQ=(v||'').trim(); dpPartRender();
    const i=$('dp-q'); if(i&&document.activeElement!==i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(e){} } }
  function dpPartToggle(uid){ if(uid===ME.uid) return;                     // l'organisateur est toujours là
    if(_dashSel.has(uid)) _dashSel.delete(uid); else _dashSel.add(uid); dpPartRender(); }
  function dpPartTous(){ _dpMem.forEach(m=>_dashSel.add(m.uid)); dpPartRender(); }
  /* Ajouter quelqu'un SANS quitter le formulaire : on tape son identifiant ou
     son numéro dans la barre, et un clic l'ajoute à l'entreprise et à la réunion. */
  async function dpAjoutDirect(){
    const raw=_dpQ.trim(); if(raw.length<3) return;
    const z=$('dp-parts'); const dire=t=>{ const e=$('dp-msg'); if(e){ e.innerHTML=t; } else toast(t.replace(/<[^>]*>/g,'')); };
    dire('<span style="color:var(--t2)">Recherche…</span>');
    const isTel=/^[0-9+ .]{6,}$/.test(raw);
    try{
      const snap=isTel ? await fs.collection('op_users').where('phone','==',raw).limit(1).get()
                       : await fs.collection('op_users').where('handle','==',handleOf(raw)).limit(1).get();
      if(snap.empty){ dire('<span style="color:var(--red)">Personne avec « '+esc(raw)+' ». Il faut d’abord lui créer un compte.</span>'
        +(IS_OWNER?' <span onclick="dpCreerCompte()" style="color:var(--op-tx);font-weight:700;cursor:pointer;text-decoration:underline">Créer le compte</span>':'')); return; }
      const u=snap.docs[0].data();
      if(u.uid===ME.uid){ dire('<span style="color:var(--t2)">C’est toi 🙂</span>'); return; }
      if(_dpMem.some(m=>m.uid===u.uid)){ _dashSel.add(u.uid); _dpQ=''; dpPartRender(); toast((u.name||'Cette personne')+' est déjà dans l’équipe — ajoutée à la réunion.'); return; }
      await fs.collection('op_companies').doc(COMP.id).collection('members').doc(u.uid)
        .set({uid:u.uid,name:u.name||'',phone:u.phone||'',role:'classique',ts:FV()});
      try{ await fs.collection('op_users').doc(u.uid).collection('invites').doc(COMP.id)
        .set({companyId:COMP.id,companyName:COMP.name,fromUid:ME.uid,fromName:USER.name||'',ts:FV()}); }catch(e){}
      _dpMem.push({uid:u.uid,name:u.name||'',handle:u.handle||'',phone:u.phone||''});
      _dashSel.add(u.uid); _dpQ='';
      dpPartRender(); toast((u.name||u.handle||'La personne')+' a rejoint l’entreprise et la réunion.');
    }catch(e){ dire('<span style="color:var(--red)">'+esc(e.message||'Erreur')+'</span>'); }
  }
  /* ══ GÉNÉRATEUR DE PARTICIPANTS DE TEST ══
     Trois vrais comptes, créés d'un clic, ajoutés à l'entreprise et à la
     réunion en cours. Marqués « test » pour pouvoir tout retirer après.
     Réservé au patron de l'entreprise. */
  const TEST_PASS='teamop2026';
  const TEST_GENS=[['Sophie','Test','sophie.test'],['Karim','Test','karim.test'],['Léa','Test','lea.test']];
  function dpMsg(t){ const e=$('dp-msg'); if(e) e.innerHTML=t; }
  async function dpGenerer(){
    if(!IS_OWNER){ toast('Seul le patron de l’entreprise peut créer des comptes.'); return; }
    if(!await opConfirme('Créer 3 participants de test dans « '+COMP.name+' » ?\n\n'
      +'Sophie Test, Karim Test, Léa Test — identifiants sophie.test, karim.test, lea.test,\n'
      +'mot de passe '+TEST_PASS+'.\n\nCe sont de vrais comptes : tu pourras te connecter avec pour '
      +'essayer les réponses aux réunions, et les supprimer d’un seul clic ensuite.')) return;
    dpMsg('<span style="color:var(--t2)">Création en cours…</span>');
    let faits=0, deja=0, rates=[];
    for(const [prenom,nom,ident] of TEST_GENS){
      const email=loginEmail(ident), nomComplet=prenom+' '+nom;
      let sec=null, uid=null;
      try{
        sec=firebase.initializeApp(FB_CONFIG,'gen'+Date.now()+Math.random().toString(36).slice(2,6));
        try{ const cred=await sec.auth().createUserWithEmailAndPassword(email,TEST_PASS); uid=cred.user.uid; faits++; }
        catch(e){
          if((e.code||'')!=='auth/email-already-in-use'){ rates.push(nomComplet+' : '+(e.message||e.code||'erreur')); await sec.delete(); continue; }
          /* le compte existe déjà : on le retrouve pour l'ajouter quand même */
          deja++;
          try{ const q=await fs.collection('op_users').where('handle','==',handleOf(ident)).limit(1).get();
            if(!q.empty) uid=q.docs[0].data().uid||q.docs[0].id; }catch(_){}
        }
        if(uid){
          const sfs=(sec&&sec.firestore)?sec.firestore():fs;
          try{ await sfs.collection('op_users').doc(uid).set({uid:uid,email:email,name:nomComplet,handle:ident,
                 role:'classique',companyId:COMP.id,companyName:COMP.name,test:true},{merge:true}); }catch(_){}
          try{ await sfs.collection('op_companies').doc(COMP.id).collection('members').doc(uid)
                 .set({uid:uid,name:nomComplet,role:'classique',test:true,ts:FV()},{merge:true}); }catch(_){}
          if(!_dpMem.some(m=>m.uid===uid)) _dpMem.push({uid:uid,name:nomComplet,handle:ident,phone:''});
          _dashSel.add(uid);
        }
        try{ await sec.auth().signOut(); }catch(_){}
        await sec.delete();
      }catch(e){ rates.push(nomComplet+' : '+(e.message||'erreur')); try{ if(sec) await sec.delete(); }catch(_){} }
    }
    try{ _members=(await listMembers()).map(m=>({uid:m.uid,name:m.name})); }catch(e){}
    _dpQ=''; _dpOuvert=true; dpPartRender();
    const accès=TEST_GENS.map(([p,n,i])=>i).join(', ');
    dpMsg(`<span style="color:var(--pres);font-weight:700">${faits?faits+' compte'+(faits>1?'s':'')+' créé'+(faits>1?'s':''):''}${(faits&&deja)?' · ':''}${deja?deja+' déjà existant'+(deja>1?'s':''):''}</span>`
      +`<br><span style="color:var(--t2)">Identifiants : <b>${accès}</b> · mot de passe <b>${TEST_PASS}</b></span>`
      +`<br><span onclick="dpCopierAcces()" style="color:var(--op-tx);font-weight:700;cursor:pointer;text-decoration:underline">Copier les accès</span>`
      +` · <span onclick="dpSupprimerTests()" style="color:var(--red);font-weight:700;cursor:pointer;text-decoration:underline">Supprimer les comptes de test</span>`
      +(rates.length?`<br><span style="color:var(--red)">${esc(rates.join(' — '))}</span>`:''));
    toast(faits?('Participants de test prêts — ajoutés à la réunion'):'Comptes de test déjà présents — ajoutés à la réunion');
  }
  function dpCopierAcces(){
    const t='Comptes de test OP MESSAGES — '+COMP.name+'\n'
      +TEST_GENS.map(([p,n,i])=>p+' '+n+' — identifiant : '+i+' — mot de passe : '+TEST_PASS).join('\n')
      +'\n\nConnexion : https://teamop.fr/messages.html';
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Accès copiés')); else opAlerte(t);
  }
  /* on retire les comptes de test : de l'entreprise ET de Firebase */
  async function dpSupprimerTests(){
    if(!IS_OWNER) return;
    if(!await opConfirme('Ils quittent l’entreprise et leurs comptes sont effacés.',
      {titre:'Supprimer les comptes de test ?',oui:'Supprimer',danger:true})) return;
    dpMsg('<span style="color:var(--t2)">Suppression…</span>');
    let n=0;
    for(const [prenom,nom,ident] of TEST_GENS){
      const email=loginEmail(ident);
      let uid=null, sec=null;
      try{ const q=await fs.collection('op_users').where('handle','==',handleOf(ident)).limit(1).get();
        if(!q.empty) uid=q.docs[0].data().uid||q.docs[0].id; }catch(e){}
      try{
        sec=firebase.initializeApp(FB_CONFIG,'del'+Date.now()+Math.random().toString(36).slice(2,6));
        const cred=await sec.auth().signInWithEmailAndPassword(email,TEST_PASS);
        uid=uid||cred.user.uid;
        const sfs=sec.firestore();
        try{ await sfs.collection('op_companies').doc(COMP.id).collection('members').doc(uid).delete(); }catch(e){}
        try{ await sfs.collection('op_users').doc(uid).delete(); }catch(e){}
        await cred.user.delete(); n++;
      }catch(e){
        /* connexion impossible (compte déjà effacé, mot de passe changé) :
           on nettoie au moins l'entreprise, avec notre propre accès */
        if(uid){ try{ await fs.collection('op_companies').doc(COMP.id).collection('members').doc(uid).delete(); n++; }catch(_){} }
      }
      try{ if(sec) await sec.delete(); }catch(e){}
      if(uid){ _dpMem=_dpMem.filter(m=>m.uid!==uid); _dashSel.delete(uid); }
    }
    try{ _members=(await listMembers()).map(m=>({uid:m.uid,name:m.name})); }catch(e){}
    dpPartRender();
    dpMsg('<span style="color:var(--t2)">'+n+' compte'+(n>1?'s':'')+' de test supprimé'+(n>1?'s':'')+'.</span>');
    toast('Comptes de test supprimés');
  }
  /* créer un compte tout neuf : on quitte le formulaire, en le disant */
  async function dpCreerCompte(){
    if(!await opConfirme('La réunion en cours de saisie sera abandonnée.',
      {titre:'Créer un compte pour un nouvel employé ?',oui:'Créer le compte'})) return;
    closeSheet(); setTimeout(()=>{ try{ addMemberForm(); }catch(e){} },140);
  }
  function dpPartAucun(){ _dashSel=new Set([ME.uid]); dpPartRender(); }
  function dpPartRender(){
    const z=$('dp-parts'); if(!z) return;
    const autres=_dpMem.filter(m=>m.uid!==ME.uid);
    const q=dpNorm(_dpQ);
    const vus=autres.filter(m=>!q||dpNorm(m.name).includes(q)||dpNorm(m.handle||'').includes(q));
    const n=Math.max(0,_dashSel.size-1);
    const choisis=autres.filter(m=>_dashSel.has(m.uid));
    const chips=choisis.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px">${choisis.map(m=>
        `<span onclick="dpPartToggle('${esc(m.uid)}')" title="Retirer ${esc(m.name||'')}"
          style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:999px;background:var(--tint2);cursor:pointer">
          <span class="dash-pp" style="width:22px;height:22px;font-size:9px;border:0;${avatarStyle(m.name)}">${ini(m.name)}</span>
          <span style="font-size:11.5px;font-weight:700">${esc((m.name||'').split(' ')[0])}</span>
          <span style="font-size:12px;color:var(--t3);font-weight:800">✕</span></span>`).join('')}</div>`:'';
    const lignes=vus.length?vus.map(m=>{ const on=_dashSel.has(m.uid);
        return `<div onclick="dpPartToggle('${esc(m.uid)}')"
          style="display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;background:${on?'var(--tint2)':'transparent'}">
          <span class="dash-pp" style="width:30px;height:30px;border:0;${avatarStyle(m.name)}">${ini(m.name)}</span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name||'Membre')}</span>
            ${m.handle?`<span style="display:block;font-size:10.5px;color:var(--t3)">${esc(m.handle)}</span>`:''}</span>
          <span class="ms" style="font-size:19px;color:${on?'var(--green)':'var(--brd2)'}">${on?'check_circle':'radio_button_unchecked'}</span></div>`;
      }).join('')
      : `<p class="muted" style="font-size:12px;padding:10px 2px;margin:0">${autres.length?'Personne à ce nom.':'Tu es seul dans l’entreprise pour le moment.'}</p>`;
    /* Fermée, la liste ne montre que les personnes retenues et un bouton.
       Ouverte, elle montre la recherche et les collègues. Une centaine de
       personnes ne fait donc jamais grandir la fenêtre. */
    const compte=n?(n+' personne'+(n>1?'s':'')+' convoquée'+(n>1?'s':'')+' · toi comme organisateur')
                  :'Personne d’autre pour l’instant — tu peux planifier seul.';
    const bouton=`<div onclick="dpPartBascule()" style="display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;background:var(--inp);cursor:pointer">
        <span style="flex:1;min-width:0;font-size:12.5px;font-weight:700">${_dpOuvert?'Fermer la liste':(n?'Modifier les participants':'Choisir les participants')}</span>
        <span style="font-size:11.5px;color:var(--t2)">${autres.length?(n+'/'+autres.length):'0'}</span>
        <span style="color:var(--t3);font-size:11px">${_dpOuvert?'▴':'▾'}</span></div>`;
    if(!_dpOuvert){
      z.innerHTML=`${chips}${bouton}
        <div id="dp-msg" style="font-size:11px;margin-top:7px;line-height:1.5"></div>
        <div style="font-size:11px;color:var(--t2);margin-top:8px">${compte}</div>`;
      return;
    }
    z.innerHTML=`${chips}${bouton}
      <div style="display:flex;align-items:center;gap:8px;margin:8px 0">
        <div style="flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:10px;background:var(--card)">
          <span class="ms" style="font-size:16px;color:var(--t3)">search</span>
          <input id="dp-q" value="${esc(_dpQ)}" placeholder="Chercher une personne…" autocapitalize="off"
            oninput="dpPartRech(this.value)"
            style="flex:1;min-width:0;border:none;background:transparent;color:var(--t1);font-family:inherit;font-size:12.5px;outline:none">
        </div>
        <span onclick="${n===autres.length&&autres.length?'dpPartAucun()':'dpPartTous()'}" style="flex:none;font-size:11px;font-weight:700;color:var(--op-tx);cursor:pointer;padding:6px 8px;white-space:nowrap">${(n===autres.length&&autres.length)?'Tout retirer':'Tout choisir'}</span>
      </div>
      <div style="max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:2px">${lignes}</div>
      ${(_dpQ.length>=3&&!vus.length)?`<div onclick="dpAjoutDirect()"
        style="display:flex;align-items:center;gap:9px;margin-top:6px;padding:9px 10px;border-radius:10px;border:1.5px dashed var(--op);color:var(--op-tx);cursor:pointer">
        <span class="ms" style="font-size:18px">person_add</span>
        <span style="font-size:12.5px;font-weight:700">Ajouter « ${esc(_dpQ)} » à l’entreprise et à la réunion</span></div>`:''}
      <div id="dp-msg" style="font-size:11px;margin-top:7px;line-height:1.5"></div>
      ${IS_OWNER?`<div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
        <div onclick="dpCreerCompte()" style="flex:1;min-width:150px;text-align:center;padding:9px 10px;border-radius:10px;background:var(--tint2);cursor:pointer;font-size:12px;font-weight:700">Créer un compte</div>
        <div onclick="dpGenerer()" title="Crée Sophie, Karim et Léa pour essayer les réunions" style="flex:1;min-width:150px;text-align:center;padding:9px 10px;border-radius:10px;border:1.5px dashed var(--brd2);cursor:pointer;font-size:12px;font-weight:700">Générer 3 personnes de test</div>
      </div>`:''}
      <div style="font-size:11px;color:var(--t2);margin-top:8px">${compte}</div>`;
  }
  function dashToggleAlert(){ _dashAlert=!_dashAlert; const t=$('dp-toggle'); if(!t) return; t.style.background=_dashAlert?'var(--green)':'var(--brd2)'; const k=t.firstElementChild; if(k) k.style.right=_dashAlert?'2px':'18px'; }
  function dashPrefill(di,h){ const mon=_dashMonday(); const d=new Date(mon); d.setDate(mon.getDate()+di);
    dashForm(_dstr(d),String(h).padStart(2,'0')+':00'); }
  // Planification : même écriture Firestore que createRoom (rooms + scheduledAt) → alertes existantes
  async function dashPlan(){
    const name=(($('dp-name')||{}).value||'').trim(); if(!name){ toast('Donnez un titre à la réunion.'); const n=$('dp-name'); if(n) n.focus(); return; }
    const dv=(($('dp-date')||{}).value||''), tv=(($('dp-time')||{}).value||'');
    if(!dv||!tv){ toast('Choisissez une date et une heure.'); return; }
    const scheduledAt=new Date(dv+'T'+tv).getTime(); if(!scheduledAt||isNaN(scheduledAt)){ toast('Date invalide.'); return; }
    const desc=((($('dp-desc')||{}).value)||'').trim().slice(0,400);
    const members=Array.from(new Set([ME.uid,..._dashSel]));
    const E=_dashEdit;
    try{
      const col=fs.collection('op_companies').doc(COMP.id).collection('rooms');
      if(E){
        /* on remplace la réunion : les règles n'autorisent pas de la modifier sur place */
        const d={name,desc,duree:_dashDuree,createdBy:ME.uid,members,createdAt:FV(),scheduledAt};
        if(E.serie){ d.serie=E.serie; d.repet=E.repet||''; }
        await col.add(d);
        try{ await col.doc(E.id).delete(); }catch(e){}
        const chg=[];
        if((E.name||'')!==name) chg.push('renommée « '+name+' »');
        if((E.scheduledAt||0)!==scheduledAt) chg.push('déplacée au '+reunionQuand(scheduledAt));
        if(((E.members||[]).length)!==members.length) chg.push('participants modifiés');
        if((E.desc||'')!==desc) chg.push('description mise à jour');
        if(dureeDe(E)!==_dashDuree) chg.push('durée : '+dureeTexte(_dashDuree));
        const tous=Array.from(new Set([...(E.members||[]),...members]));
        await reunionPrevenir(tous, `${(USER&&USER.name)||'L’organisateur'} a modifié « ${E.name||name} » : ${chg.length?chg.join(', '):'quelques détails'}.${((E.scheduledAt||0)!==scheduledAt)?' Merci de reconfirmer ta présence.':''}`, 'Réunion modifiée');
        _dashEdit=null;
        try{ closeSheet(); }catch(e){}
        toast('Réunion modifiée — les participants sont prévenus.');
        if(_curView==='dash') viewDash();
        return;
      }
      const dates=dashRepetDates(); const serie=(dates.length>1)?('s'+Date.now()):'';
      for(const t of (dates.length?dates:[scheduledAt])){
        const d={name,desc,duree:_dashDuree,createdBy:ME.uid,members,createdAt:FV(),scheduledAt:t};
        if(serie){ d.serie=serie; d.repet=_dashRepet; }
        await col.add(d);
      }
      try{ closeSheet(); }catch(e){}
      /* on prévient les convoqués : c'était annoncé mais rien ne partait */
      const autres=members.filter(u=>u!==ME.uid);
      if(_dashAlert && autres.length){
        const t0=(dates.length?dates[0]:scheduledAt);
        const txt=`${(USER&&USER.name)||'L’organisateur'} t’a convié à « ${name} » — ${reunionQuand(t0)} · ${dureeTexte(_dashDuree)}`
          +(dates.length>1?` (et ${dates.length-1} autre${dates.length-1>1?'s':''} dans la série)`:'')
          +`${desc?' — '+desc.slice(0,120):''}. Réponds Présent, En retard ou Absent.`;
        await reunionPrevenir(members, txt, 'Nouvelle réunion · '+((COMP&&COMP.name)||''));
      }
      toast(dates.length>1?(dates.length+' réunions planifiées'+(_dashAlert&&autres.length?' — les participants sont prévenus.':'.'))

  async function badgesMaj(){ try{

    if(MODE==='perso'){ (await ch.where('members','array-contains',ME.uid).get()).forEach(d=>map[d.id]=d.data()); }

      gen.forEach(d=>map[d.id]=d.data()); grp.forEach(d=>map[d.id]=d.data()); }

      let u=Math.max(0,(c.msgCount||0)-getReadCount(id));

      n+=u; });

        const t=c.lastMsgAt?fmtListTime(c.lastMsgAt):'';
        const unread=unreadOf(id,c);
        const badge = unread? `<span style="min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--badge-bg);color:var(--badge-tx);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center">${unread>99?'99+':unread}</span>` : '';

        const actBtn=(bg,ic2,lbl,fn)=>`<div onclick="${fn}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:${bg};color:#fff;cursor:pointer;font-size:10.5px;font-weight:700"><span style="font-size:17px">${ic2}</span>${lbl}</div>`;
        return `<div class="sw-wrap" data-cid="${id}" style="position:relative;overflow:hidden">
          <div style="position:absolute;top:0;bottom:0;left:0;width:148px;display:flex">
            ${actBtn('var(--op)','💬',unread?'Lu':'Non lu',`rowMarkRead('${id}',${unread?'true':'false'})`)}

          </div>
          <div style="position:absolute;top:0;bottom:0;right:0;width:148px;display:flex">
            ${actBtn('#64748b','⋯','Options',`rowMenu('${id}','${nmSafe}')`)}
            ${actBtn('var(--op)','🗄️',isArch(id)?'Désarchiver':'Archiver',`rowArch('${id}')`)}
          </div>
          <div class="row sw-row${(typeof _curCh!=='undefined'&&_curCh&&_curCh.id===id)?' ouverte':''}" data-nm="${nmSafe}" onclick="${_selMode?`selToggle('${id}')`:`rowOpen('${id}','${nmSafe}')`}" style="position:relative;background:var(--card);margin:0">${_selMode?`<div style="width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid ${_selSet.has(id)?'var(--op)':'var(--brd2)'};background:${_selSet.has(id)?'var(--op)':'transparent'};color:#fff">${_selSet.has(id)?'✓':''}</div>`:''}<div class="ava" style="${avBg}">${avInner}</div><div class="info"><div class="nm">${isPinned(id)?'📌 ':''}${marque}${esc(nm)}${isFav(id)?' ⭐':''}${isMuted(id)?' 🔇':''}${isLocked(id)?' 🔒':''}</div><div class="ds">${sub}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><span class="when" style="font-size:11.5px;font-weight:600;color:var(--t3)">${t}</span>${badge}</div></div>

  // Glissements façon WhatsApp : droite = Lu/Non lu + Épingler · gauche = Options + Archiver
  // (+ appui long / clic droit = menu complet)
  function bindRowPress(){ document.querySelectorAll('#disc-list .sw-wrap').forEach(w=>{
    const row=w.querySelector('.sw-row'); if(!row) return;
    let sx=0,sy=0,base=0,dragging=false,lp=null;
    const setTx=(x,anim)=>{ row.style.transition=anim?'transform .18s ease':'none'; row.style.transform=x?('translateX('+x+'px)'):''; w.dataset.tx=x; };
    row.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; base=+(w.dataset.tx||0); dragging=false;
      lp=setTimeout(()=>{ lp=null; if(!dragging){ _lpUntil=Date.now()+900; if(vibrateOn()&&navigator.vibrate) try{navigator.vibrate(35);}catch(e){} rowMenu(w.dataset.cid,row.dataset.nm); } },500); },{passive:true});
    row.addEventListener('touchmove',e=>{ const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      if(!dragging && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){ dragging=true; if(lp){clearTimeout(lp);lp=null;} }
      if(!dragging && Math.abs(dy)>25 && lp){ clearTimeout(lp); lp=null; }
      if(dragging) setTx(Math.max(-148,Math.min(148,base+dx)),false); },{passive:true});
    const end=()=>{ if(lp){clearTimeout(lp);lp=null;}
      const tx=+(w.dataset.tx||0);
      if(!dragging){ if(tx){ setTx(0,true); _lpUntil=Date.now()+450; } return; }
      dragging=false; _lpUntil=Date.now()+450;
      if(tx>125){ setTx(0,true); swFullRead(w.dataset.cid); }          // glissement complet à droite = lu/non lu
      else if(tx>60) setTx(148,true);                                   // révèle Non lu / Épingler
      else if(tx<-125){ setTx(0,true); rowArch(w.dataset.cid); }        // glissement complet à gauche = archiver
      else if(tx<-60) setTx(-148,true);                                 // révèle Options / Archiver
      else setTx(0,true); };
    row.addEventListener('touchend',end,{passive:true});
    row.addEventListener('touchcancel',end,{passive:true});
    row.addEventListener('contextmenu',e=>{ e.preventDefault(); rowMenu(w.dataset.cid,row.dataset.nm); });
  }); }

    if(vibrateOn()&&navigator.vibrate) try{navigator.vibrate(25);}catch(e){}
    rowMarkRead(id,unread); }

  /* ══ LE PANNEAU DE DROITE (grand écran) ══
     Ce qui compte aujourd'hui, sans changer de page : les réunions du jour,
     les derniers documents reçus, et deux raccourcis. */
  async function discSide(){ const z=$('disc-side'); if(z) z.innerHTML=''; }
  /* ══ LA RECHERCHE PARTOUT ══
     Une seule barre qui fouille TOUTES les conversations : le code d'un
     portail, une facture, une adresse — on retrouve le message et on saute
     dessus d'un clic, même s'il date de plusieurs mois. */
  let _rechTout=[], _rechMot='', _rechEnCours=false, _rechT=null;
  async function rechPartout(mot){
    _rechMot=(mot||'').trim().toLowerCase();
    const z=$('disc-partout'); if(!z) return;
    if(_rechMot.length<2){ z.innerHTML=''; _rechTout=[]; return; }
    if(_rechEnCours) return;
    _rechEnCours=true;
    z.innerHTML='<p class="muted" style="font-size:12px;margin:6px 2px">Recherche dans toutes les discussions…</p>';
    const mot2=_rechMot;
    try{
      const ch=chanCol(); const map={};
      if(MODE==='perso'){ (await ch.where('members','array-contains',ME.uid).get()).forEach(d=>map[d.id]=d.data()); }
      else { const [gen,grp]=await Promise.all([ch.where('type','==','general').get(), ch.where('members','array-contains',ME.uid).get()]);
        gen.forEach(d=>map[d.id]=d.data()); grp.forEach(d=>map[d.id]=d.data()); }
      const noms={}; try{ (await listMembers()).forEach(m=>noms[m.uid]=m.name||''); }catch(e){}
      const trouves=[];
      for(const [cid,c] of Object.entries(map)){
        let nomCanal=c.type==='general'?'Général':(c.name||'Discussion');
        if(c.type==='dm'){ const o=(c.members||[]).find(u=>u!==ME.uid); nomCanal=noms[o]||'Message privé'; }
        try{ const qs=await ch.doc(cid).collection('messages').get();
          qs.forEach(d=>{ const m=d.data()||{};
            if(m.programmeAt&&m.programmeAt>Date.now()) return;      // pas encore envoyé
            const txt=String(m.text||'');
            if(!txt.toLowerCase().includes(mot2)) return;
            const t=(m.ts&&m.ts.toDate)?m.ts.toDate():new Date();
            trouves.push({cid:cid,canal:nomCanal,mid:d.id,qui:m.name||'',txt:txt,d:t});
          });
        }catch(e){}
      }
      if(mot2!==_rechMot){ _rechEnCours=false; return rechPartout(_rechMot); }   // la frappe a continué
      trouves.sort((a,b)=>b.d-a.d);
      _rechTout=trouves;
      rechRender();
    }catch(e){ z.innerHTML='<p class="muted" style="font-size:12px;margin:6px 2px">Recherche impossible pour le moment.</p>'; }
    _rechEnCours=false;
  }
  function rechRender(){
    const z=$('disc-partout'); if(!z) return;
    const l=_rechTout;
    if(!_rechMot||_rechMot.length<2){ z.innerHTML=''; return; }
    if(!l.length){ z.innerHTML=`<p class="muted" style="font-size:12.5px;margin:8px 2px">Aucun message ne contient « ${esc(_rechMot)} ».</p>`; return; }
    /* on met le mot cherché en évidence dans un extrait du message */
    const extrait=(txt)=>{
      const i=txt.toLowerCase().indexOf(_rechMot);
      const a=Math.max(0,i-38), b=Math.min(txt.length,i+_rechMot.length+58);
      const av=esc(txt.slice(a,i)), mot=esc(txt.slice(i,i+_rechMot.length)), ap=esc(txt.slice(i+_rechMot.length,b));
      return (a>0?'…':'')+av+'<mark style="background:rgba(94,130,255,.35);color:inherit;border-radius:4px;padding:0 2px">'+mot+'</mark>'+ap+(b<txt.length?'…':'');
    };
    z.innerHTML=`<div style="font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--t3);margin:10px 2px 6px">
        ${l.length} MESSAGE${l.length>1?'S':''} TROUVÉ${l.length>1?'S':''}</div>
      <div class="listbox">${l.slice(0,60).map(x=>`
        <div class="row" onclick="rechAller('${esc(x.cid)}','${esc((x.canal||'').replace(/'/g,''))}','${esc(x.mid)}')">
          <div class="ava" style="${avatarStyle(x.qui||x.canal)}">${ini(x.qui||x.canal)}</div>
          <div class="info"><div class="nm">${esc(x.qui||'')} · <span style="font-weight:600;color:var(--t2)">${esc(x.canal)}</span></div>
            <div class="ds">${extrait(x.txt)}</div></div>
          <div style="font-size:11px;color:var(--t3);white-space:nowrap">${esc(x.d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}))}</div>
        </div>`).join('')}</div>
      ${l.length>60?`<p class="muted" style="font-size:11.5px;margin:8px 2px">Les 60 plus récents sont affichés — précise ta recherche pour en voir d'autres.</p>`:''}`;
  }
  /* ouvrir la discussion et sauter sur le message trouvé */
  let _rechCible=null;
  function rechAller(cid,nom,mid){

  function rechSurligne(){

  /* ══ LE TROMBONE DE L'ENTREPRISE ══
     Toutes les photos et tous les documents échangés dans toutes les
     discussions, au même endroit, avec une recherche. Fini la photo perdue

  let _docs=[], _docsRech='', _docsCanal=null, _docsRetourNom='';
  async function vueDocuments(cid){
    const view=$('view'); _docsCanal=cid||null;
    if(cid) _docsRetourNom=(_curCh&&_curCh.id===cid?_curCh.name:'')||_docsRetourNom||'';
    view.innerHTML=`<div class="view-h" style="align-items:center;gap:10px">

        <h2 style="margin:0">Documents</h2></div>
      <div class="gsearch">${ms('search',19)}<input id="doc-rech" placeholder="Rechercher un document, une photo…" oninput="_docsRech=this.value.trim().toLowerCase();docsRender()"></div>
      <div id="doc-liste"><p class="muted center">Recherche dans toutes les discussions…</p></div>`;
    _docs=[];
    try{
      const ch=chanCol(); const map={};
      if(cid){ const d=await ch.doc(cid).get(); map[cid]=d.data()||{}; }
      else if(MODE==='perso'){ (await ch.where('members','array-contains',ME.uid).get()).forEach(d=>map[d.id]=d.data()); }
      else { const [gen,grp]=await Promise.all([ch.where('type','==','general').get(), ch.where('members','array-contains',ME.uid).get()]);
        gen.forEach(d=>map[d.id]=d.data()); grp.forEach(d=>map[d.id]=d.data()); }
      for(const [id,c] of Object.entries(map)){
        const nomCanal=c.type==='general'?'Général':(c.name||'Discussion');
        try{ const qs=await ch.doc(id).collection('messages').get();
          qs.forEach(d=>{ const m=d.data()||{};
            if(m.programmeAt&&m.programmeAt>Date.now()) return;
            const t=(m.ts&&m.ts.toDate)?m.ts.toDate():new Date();
            /* les messages vocaux ne sont pas des documents : ils restent
               dans la conversation, à leur place */
            if(m.img) _docs.push({type:'photo',nom:'Photo',par:m.name||'',canal:nomCanal,cid:id,d:t,data:m.img});
            else if(m.file) _docs.push({type:'fichier',nom:(m.file.name||'Fichier'),par:m.name||'',canal:nomCanal,cid:id,d:t,file:m.file});
          });
        }catch(e){}
      }
      _docs.sort((a,b)=>b.d-a.d);
    }catch(e){}
    docsRender();
  }
  /* Revenir des documents ne doit pas quitter la conversation : on la rouvre
     là où on l'avait laissée. */
  async function docsRetour(){
    const cid=_docsCanal, nom=_docsRetourNom;

  function docsRender(){
    const z=$('doc-liste'); if(!z) return;
    let l=_docs;
    if(_docsRech) l=l.filter(x=>(x.nom+' '+x.par+' '+x.canal).toLowerCase().includes(_docsRech));
    if(!l.length){ z.innerHTML=`<p class="muted center">${_docs.length?'Rien ne correspond à cette recherche.':'Aucun document échangé pour le moment.'}</p>`; return; }
    const ico={photo:'🖼️',fichier:'📄'};
    z.innerHTML=`<p class="muted" style="font-size:12px;margin:0 2px 10px">${l.length} élément${l.length>1?'s':''}</p><div class="listbox">`+
      l.map((x,i)=>`<div class="row" onclick="docOuvrir(${_docs.indexOf(x)})">
        ${x.type==='photo'?`<img src="${x.data}" style="width:44px;height:44px;border-radius:11px;object-fit:cover;flex-shrink:0">`
          :`<div class="ava" style="background:var(--tile-bg);color:var(--tile-tx);border-radius:11px">${ico[x.type]}</div>`}
        <div class="info"><div class="nm">${esc(x.nom)}</div>
          <div class="ds">${esc(x.par)}${_docsCanal?'':' · '+esc(x.canal)} · ${esc(x.d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}))}</div></div>
        <div class="chev">›</div></div>`).join('')+`</div>`;
  }
  function docOuvrir(i){
    const x=_docs[i]; if(!x) return;
    if(x.type==='photo'){ const w=window.open(); if(w) w.document.write('<img src="'+x.data+'" style="max-width:100%">'); return; }
    /* un vrai fichier : on le reconstruit pour que l'appareil sache l'ouvrir */
    try{
      const blob=fichierBlob(x.file);
      const souris=(function(){ try{ return window.matchMedia('(hover: hover) and (pointer: fine)').matches; }catch(e){ return true; } })();
      if(!souris && navigator.canShare){ try{ const f=new File([blob],x.file.name||'fichier',{type:blob.type});
        if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:x.file.name||'Fichier'}); return; } }catch(e){} }
      const url=URL.createObjectURL(blob); const w=window.open(url,'_blank');
      if(!w){ const a=document.createElement('a'); a.href=url; a.download=x.file.name||'fichier'; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} },60000);
    }catch(e){ toast('Ouverture impossible'); }
  }
  // ---- CONTACTS (membres) ----

  /* ══ L'ONGLET CONTACTS ══
     Une liste de noms ne sert à rien. Ici on veut savoir en un coup d'œil
     QUI fait quoi, QUI est disponible, et pouvoir écrire ou appeler tout de
     suite — à une personne ou à plusieurs d'un coup. */
  let _contFiltre='tous', _contSel=new Set(), _contMode=false;
  function contFiltre(k){ _contFiltre=k;
    const sg=$('cont-seg'); if(sg) [...sg.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
    renderContList(); }
  /* les favoris : les 3-4 personnes qu'on appelle tous les jours */
  function contFavs(){ try{ return new Set(JSON.parse(localStorage.getItem('opmsg_cont_favs')||'[]')); }catch(e){ return new Set(); } }
  function contEstFav(uid){ return contFavs().has(uid); }
  function contFav(uid){ const f=contFavs(); if(f.has(uid)) f.delete(uid); else f.add(uid);
    try{ localStorage.setItem('opmsg_cont_favs',JSON.stringify([...f])); }catch(e){}
    closeSheet(); renderContList(); toast(f.has(uid)?'⭐ Ajouté aux favoris':'Retiré des favoris'); }
  /* « En ligne » quand c'est vrai, sinon l'heure de la dernière fois */
  function contVu(m){
    const t=m&&m.lastActive;
    if(!t) return 'Hors ligne';
    const d=new Date(t), n=new Date();
    const hh=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const meme=d.toDateString()===n.toDateString();
    if(meme) return 'En ligne '+hh;
    const hier=new Date(n.getTime()-86400000);
    if(d.toDateString()===hier.toDateString()) return 'En ligne hier '+hh;
    return 'En ligne le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+hh;
  }
  /* l'ordre de la liste : d'abord ceux qu'on peut déranger tout de suite */
  const _CONT_RANG={inter:1,pause:2,conges:3};
  function _contRang(m){
    const st=statutDe(m);                       // « disponible » ne renvoie rien : c'est l'état normal
    if(st&&_CONT_RANG[st.code]!==undefined) return _CONT_RANG[st.code];
    return isOnline(m)?0:4;                     // en ligne et sans statut = disponible ; sinon en dernier
  }
  function contTri(list){
    const favs=contFavs();
    return list.slice().sort((a,b)=>{
      if(a.uid===ME.uid) return -1; if(b.uid===ME.uid) return 1;
      const fa=favs.has(a.uid)?0:1, fb=favs.has(b.uid)?0:1; if(fa!==fb) return fa-fb;
      const ra=_contRang(a), rb=_contRang(b); if(ra!==rb) return ra-rb;
      return (a.name||'').localeCompare(b.name||'','fr');
    });
  }
  function contGarde(m){
    if(_contFiltre==='dispo') return !statutDe(m)&&(isOnline(m)||m.uid===ME.uid);

    if(_contFiltre==='resp') return (m.role==='responsable')||(MODE!=='perso'&&m.uid===COMP_owner());
    return true;
  }

  function contSelAppel(type){ const ids=[..._contSel]; if(!ids.length) return; const noms=_contNoms(); contSelStop(); startCall(ids,noms,type||'audio'); }

  function contBarre(){

      </div></div>`;
