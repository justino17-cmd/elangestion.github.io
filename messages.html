  // ---- APPELS (style WhatsApp : direct + groupe d'appel) ----
  function tms(t){ return t&&t.toMillis?t.toMillis():0; }
  let _callFilter='all',_callRecents=[],_callSearch='';
  function setCallFilter(k){ _callFilter=k; const sg=$('call-seg'); if(sg){ [...sg.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.k===k)); } viewAppelList(); }
  async function viewAppel(){
    _callSearch='';
    /* Un appel n'est pas une réunion : ici, UNIQUEMENT le téléphone.
       Les réunions planifiées vivent sur leur propre page et le calendrier. */
    const view=$('view'); view.innerHTML=`<div class="view-h"><h2>Appels</h2><button class="hbtn blue" onclick="newCall()">${ms('add_call',18)}Nouvel appel</button></div>
      <p class="muted" style="font-size:12px;margin:-6px 2px 12px">Le téléphone de l'équipe : ça sonne, on décroche. Pour les rendez-vous planifiés, va dans <a onclick="${isPro()?'openReunions()':''}" style="color:var(--op-tx);cursor:pointer;text-decoration:underline">Réunions</a>.</p>
      <div class="gsearch">${ms('search',19)}<input id="call-search" placeholder="Rechercher un appel…" oninput="_callSearch=this.value.trim().toLowerCase();viewAppelList()"></div>
      <div style="overflow:auto;padding:0 2px 14px;-webkit-overflow-scrolling:touch"><div class="seg" id="call-seg">${[['all','Tous'],['missed','Manqués'],['in','Entrants'],['out','Sortants']].map(([k,l])=>`<button data-k="${k}" class="${_callFilter===k?'on':''}" onclick="setCallFilter('${k}')">${l}</button>`).join('')}</div></div>
      <div id="call-list"><p class="muted center">Chargement…</p></div>`;
    try{
      const col=callsCol();
      const [a,b]=await Promise.all([ col.where('from','==',ME.uid).get(), col.where('members','array-contains',ME.uid).get() ]);
      const map={}; a.forEach(d=>map[d.id]={id:d.id,...d.data()}); b.forEach(d=>map[d.id]={id:d.id,...d.data()});
      /* un appel EN COURS s'affiche toujours, même si l'historique a été vidé */
      _callTous=Object.values(map);
      const _cc=+(localStorage.getItem(callClearKey())||0);
      /* un appel = UNE ligne : si quelqu'un a été ajouté en cours de route,
         sa fiche d'invitation ne doit pas faire doublon avec l'appel */
      const parSalle={}, gardees=[];
      Object.values(map).filter(c=>tms(c.ts)>_cc).forEach(c=>{
        if(!c.room){ gardees.push(c); return; }
        const p=parSalle[c.room];
        if(!p||tms(c.ts)<tms(p.ts)) parSalle[c.room]=c;
      });
      Object.values(parSalle).forEach(c=>gardees.push(c));
      _callRecents=gardees.sort((x,y)=>tms(y.ts)-tms(x.ts)).slice(0,60);
      viewAppelList();
      appelsVivantsMaj();
      if(_callLiveT) clearInterval(_callLiveT);
      _callLiveT=setInterval(()=>{ if(!$('call-list')){ clearInterval(_callLiveT); _callLiveT=null; return; } appelsVivantsMaj(); },15000);
    }catch(e){ $('call-list').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
  }
  /* ── LES APPELS EN COURS ──
     Un appel à trois ou plus continue sans ceux qui sont partis. Tant qu'il
     reste quelqu'un en ligne, il s'affiche en haut de l'onglet Appels avec
     le nom des présents : un bouton, et on y retourne. */
  let _callVivants={},_callLiveT=null,_callTous=[];
  async function appelsVivantsMaj(){
    const v={};
    try{
      const qs=await callsCol().where('type','==','ici').get();
      const lim=Date.now()-70000;
      qs.forEach(d=>{ const x=d.data()||{};
        if(!x.room||!x.ts||x.ts<lim) return;
        const l=(v[x.room]=v[x.room]||[]);
        if(l.indexOf(x.nom||'')<0) l.push(x.nom||'');
      });
    }catch(e){}
    _callVivants=v;
    const z=$('call-live'); if(z) z.innerHTML=appelsVivantsHtml();
  }
  function appelsVivantsHtml(){
    const vus={}, l=[];
    (_callTous||[]).forEach(c=>{
      if(!c.room||vus[c.room]) return;
      const gens=_callVivants[c.room]; if(!gens||!gens.length) return;
      if(_vRoom===c.room) return;                       // j'y suis déjà
      vus[c.room]=1; l.push({c:c,gens:gens});
    });
    if(!l.length) return '';
    return '<div class="listbox" style="border-color:var(--op);margin-bottom:12px">'+l.map(x=>{
      const noms=x.gens.filter(n=>n).join(', ')||'en ligne';
      const revenir=salleDejaVue(x.c.room);
      return `<div class="lrow" style="background:var(--tint2)">
        <div class="cava" style="background:var(--pres);color:#08130c;border-radius:11px">${ms('call',20)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Appel en cours</div>
          <div style="font-size:13px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(noms)} · ${x.gens.length} personne${x.gens.length>1?'s':''} en ligne</div></div>
        <button class="btn sm" style="flex:none;font-weight:800" onclick="event.stopPropagation();rejoindreAppel('${esc(x.c.id)}')">${revenir?'Revenir':'Rejoindre'}</button>
      </div>`;
    }).join('')+'</div>';
  }
  /* revenir dans un appel qu'on a quitté (ou en rejoindre un en cours) */
  async function rejoindreAppel(id){
    /* la fiche est déjà sous la main : on n'attend pas le réseau pour rentrer */
    let c=(_callTous||[]).find(x=>x.id===id)||{};
    if(!c.room){ try{ const d=await callsCol().doc(id).get(); if(d.exists) c={id:d.id,...d.data()}; }catch(e){} }
    if(!c.room){ opAlerte('Cet appel n\'est plus disponible.'); return; }
    const out=c.from===ME.uid;
    const noms = out ? ((c.memberNames||[]).join(', ')) : ([c.fromName].concat((c.memberNames||[]).filter(n=>n&&n!==(USER&&USER.name))).join(', '));
    if(_callDocUnsub){ _callDocUnsub(); _callDocUnsub=null; }
    _activeCall={ref:callsCol().doc(id),answered:true,oneToOne:(c.members||[]).length===1};
    visioOuvrir(c.room, noms||'Appel', (c.type||'video')==='audio', 'appel');
  }
  function viewAppelList(){
    const box=$('call-list'); if(!box) return;
    const list=_callRecents.filter(c=>{ const out=c.from===ME.uid; const missed=c.status==='missed'||c.status==='declined';

  /* ── les paires ── */
  function _vPair(uid,nom){
    _vDejaVenu=true;
    if(_vPairs[uid]) return _vPairs[uid];
    const pc=new RTCPeerConnection(_vConf);
    const p={pc:pc,nom:nom||'',streams:{cam:null,ecran:null},ecranIds:new Set(),dc:null,glace:[],pret:false,muetPourMoi:false,ecranSenders:[],
      /* négociation « polie » : si deux offres se croisent, le poli cède et
         reprend juste après ; l'impoli garde la sienne. Qui est poli ? C'est
         fixé une fois pour toutes par les identifiants — les deux côtés
         tombent d'accord sans se parler. */
      poli:String(ME.uid)<String(uid), faisOffre:false};
    _vPairs[uid]=p;
    _vMaxGens=Math.max(_vMaxGens,1+Object.keys(_vPairs).length);   // à trois, l'appel devient un appel de groupe
    _vSeulStop();                                                  // quelqu'un est là : plus de compte à rebours
    /* quelqu'un est entré dans la salle : l'appel est décroché, même si la
       petite mise à jour de la fiche s'est perdue en route */
    if(_vGenre==='appel'&&_activeCall) _activeCall.answered=true;
    /* ON A DÉCROCHÉ : la sonnerie s'arrête, un petit son le confirme, et
       la durée repart de zéro — comme sur un téléphone. */
    if(_vGenre==='appel'&&_sonnerieT){ sonnerieSortante(false); visioSansReponse(false);
      sonAppel('debut'); _vT0=Date.now(); visioEtat(''); }
    try{ (_vLocal?_vLocal.getTracks():[]).forEach(t=>{ const sn=pc.addTrack(t,_vLocal);
      if(t.kind==='video') p.camSendersMoi=(p.camSendersMoi||[]).concat([sn]); }); }catch(e){}
    /* la qualité se règle dès la connexion, pas seulement au partage d'écran */
    setTimeout(()=>{ try{ _vRegleEnvoi(p); }catch(e){} },1200);
    try{ if(_vEcran){ _vEcran.getTracks().forEach(t=>p.ecranSendersMoi=(p.ecranSendersMoi||[]).concat([pc.addTrack(t,_vEcran)])); setTimeout(()=>_vRegleEnvoi(p),800); } }catch(e){}
    pc.onicecandidate=ev=>{ if(ev.candidate) _vDire({type:'ice',a:uid,cand:JSON.stringify(ev.candidate)}); };
    pc.ontrack=ev=>{ const st=ev.streams[0]||new MediaStream([ev.track]);
      if(p.ecranIds.has(st.id)) p.streams.ecran=st;
      else if(!p.streams.cam||p.streams.cam.id===st.id) p.streams.cam=st;
      else p.streams.ecran=st;
      _vReclasse(p); ecranArrive(uid); visioTuiles(); };
    pc.ondatachannel=ev=>_vDcAttache(uid,ev.channel);
    pc.onnegotiationneeded=async()=>{
      /* on annonce le changement ; si ça se percute avec l'offre d'en face,
         la règle du poli (voir visioTraiter) départage proprement */
      try{ p.faisOffre=true;
        await pc.setLocalDescription();
        await _vDire({type:'offre',a:uid,sdp:JSON.stringify(pc.localDescription)});
      }catch(e){}
      p.faisOffre=false;
    };
    pc.onconnectionstatechange=()=>{ const st=pc.connectionState;
      if(st==='connected') visioEtat('');
      if(st==='failed'){ visioEtat('connexion difficile'); visioSecoursBtn(); }
      if(st==='connecting') visioEtat(_vGenre==='appel'?'connexion…':'');
      if(st==='disconnected'){ visioEtat('reconnexion…');   /* le réseau a toussé : on relance les chemins avant d'abandonner */
        try{ if(pc.restartIce) pc.restartIce(); }catch(e){}
        setTimeout(()=>{ if(pc.connectionState==='disconnected'||pc.connectionState==='closed'){ delete _vPairs[uid]; visioTuiles(); } },8000); }
      if(st==='closed'){ setTimeout(()=>{ if(pc.connectionState==='closed'){ delete _vPairs[uid]; visioTuiles(); } },2000); }
    };

    visioTuiles();

  }
  /* ── l'écran d'un collègue passe en GRAND tout seul ──
     Comme sur WhatsApp : quand quelqu'un partage, on le voit tout de suite,
     pas besoin de chercher la petite tuile. Une seule fois par partage —
     si tu choisis ensuite une autre disposition, on la respecte. */
  const _vEcranPin=new Set();
  function ecranArrive(uid){
    const p=_vPairs[uid]; if(!p||!p.streams.ecran) return;
    const cle=uid+'|'+p.streams.ecran.id;
    if(_vEcranPin.has(cle)) return; _vEcranPin.add(cle);
    _vGrand=uid+'::E';
    try{ toast('🖥️ '+((p.nom||'').split(' ')[0]||'Un collègue')+' partage son écran'); }catch(e){}
    visioTuiles();
  }
  function _vReclasse(p){
    /* si un flux rangé en caméra est en fait un écran annoncé, on le déplace */
    if(p.streams.cam&&p.ecranIds.has(p.streams.cam.id)){ p.streams.ecran=p.streams.cam; p.streams.cam=null; }
    if(p.streams.ecran&&p.streams.cam&&p.ecranIds.has(p.streams.cam.id)&&!p.ecranIds.has(p.streams.ecran.id)){
      const e=p.streams.cam; p.streams.cam=p.streams.ecran; p.streams.ecran=e; }
  }
  async function visioTraiter(d){
    if(!_vRoom||!d||d.room!==_vRoom||!d.sig) return;
    if(d.de===ME.uid) return;
    if(d.a&&d.a!==ME.uid) return;
    if(_vVus.has(d.id)) return; _vVus.add(d.id);
    if(d.ts&&Date.now()-d.ts>3*3600000) return;
    if(d.type==='salut'){
      if(ME.uid>d.de && !_vPairs[d.de]){
        const p=_vPair(d.de,d.nom);
        _vDcAttache(d.de,p.pc.createDataChannel('op'));
        /* l'offre part toute seule (onnegotiationneeded) : UNE seule source
           d'offres, sinon deux partaient en même temps au démarrage */
      } else if(ME.uid<d.de && !_vPairs[d.de]){
        await _vDire({type:'salut',a:d.de});
      }
      return;
    }
    if(d.type==='offre'){
      const p=_vPair(d.de,d.nom);
      /* deux offres qui se croisent : l'impoli ignore celle d'en face (la
         sienne gagnera), le poli abandonne la sienne et accepte celle-ci */
      const collision=p.faisOffre||p.pc.signalingState!=='stable';
      if(collision&&!p.poli) return;
      try{
        if(collision){ try{ await p.pc.setLocalDescription({type:'rollback'}); }catch(e){} }
        await p.pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.sdp)));
      }catch(e){ return; }
      p.pret=true; for(const c of p.glace) try{ await p.pc.addIceCandidate(c); }catch(e){} p.glace=[];
      const rep2=await p.pc.createAnswer(); await p.pc.setLocalDescription(rep2);
      await _vDire({type:'reponse',a:d.de,sdp:JSON.stringify(rep2)});
      return;
    }
    if(d.type==='reponse'){
      const p=_vPairs[d.de]; if(!p) return;
      if(p.pc.signalingState!=='have-local-offer') return;   // réponse arrivée trop tard : sans objet
      try{ await p.pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(d.sdp))); }catch(e){ return; }
      p.pret=true; for(const c of p.glace) try{ await p.pc.addIceCandidate(c); }catch(e){} p.glace=[];
      return;
    }
    if(d.type==='ecran'){
      /* l'annonce d'écran passe AUSSI par la salle : même si le petit canal
         direct traîne, chacun sait que ce flux-là est un écran */
      const p=_vPairs[d.de]; if(!p) return;
      p.ecranIds.add(d.eid); _vReclasse(p); ecranArrive(d.de); visioTuiles(); return;
    }
    if(d.type==='ecranfin'){
      const p=_vPairs[d.de]; if(!p) return;
      p.streams.ecran=null; delete _vNotes[d.de];
      if(_vGrand===d.de+'::E') _vGrand=null; visioTuiles(); return;
    }
    if(d.type==='ice'){
      const p=_vPairs[d.de]; if(!p) return;
      const c=new RTCIceCandidate(JSON.parse(d.cand));
      if(p.pret){ try{ await p.pc.addIceCandidate(c); }catch(e){} } else p.glace.push(c);
      return;
    }
    if(d.type==='pars'){
      const p=_vPairs[d.de]; const qui=(p&&p.nom)||d.nom||'';
      if(p){ try{ p.pc.close(); }catch(e){} delete _vPairs[d.de]; visioTuiles(); }
      /* UN APPEL À DEUX : si l'autre raccroche, il n'y a plus d'appel du tout.
         On ne laisse personne seul dans le studio. Une réunion, elle, reste
         ouverte : les gens arrivent et repartent au fil de l'heure. */
      if(_vGenre==='appel'){
        /* une réunion n'arrive jamais ici — voir visioOuvrir */
        if(_vMaxGens>=3){
          /* APPEL DE GROUPE : chacun va et vient. On ne coupe rien, la ligne
             reste ouverte et celui qui est parti peut revenir quand il veut. */
          if(Object.keys(_vPairs).length) try{ toast((qui||'Quelqu\'un')+' a quitté l\'appel — il peut revenir quand il veut.'); }catch(e){}
          else _vSeulDebut();
        } else if(_vDejaVenu && !Object.keys(_vPairs).length){
          /* APPEL À DEUX : plus personne au bout du fil, l'appel est fini. */
          try{ toast((qui?qui+' a raccroché — ':'')+'appel terminé'); }catch(e){}
          try{ hideRing(); }catch(e){}
          setTimeout(()=>{ try{ if(_vRoom) visioFermer(); }catch(e){} },250);
        }
      }
      return;
    }
  }
  /* ══ RENDRE LE MICRO ET LA CAMÉRA ══
     Tant qu'un appel est en cours OU qu'un appel patiente, l'appareil en a
     besoin. Dès que ce n'est plus le cas, on les rend : le voyant orange du
     téléphone ou du Mac doit s'éteindre tout seul. */
  /* ══ TOUT COUPER : micro, caméra, écran ══
     Un seul geste, appelé par TOUS les chemins de sortie — le bouton
     Quitter, la croix, le retour arrière, la fermeture de l'onglet. Rien
     ne doit rester allumé quand la réunion est finie. */
  function toutCouper(){
    try{ if(_vEcran){ _vEcran.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); } }catch(e){} _vEcran=null;
    try{ if(_vLocal){ _vLocal.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); } }catch(e){} _vLocal=null;
    try{ if(typeof _porteFlux!=='undefined'&&_porteFlux){ _porteFlux.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); _porteFlux=null; } }catch(e){}
    _vCamOn=false;
    try{ if(document.pictureInPictureElement) document.exitPictureInPicture(); }catch(e){}
    try{ ecranEveille(false); }catch(e){}
    try{ const b=$('visio-ecran'); if(b){ b.classList.remove('attend'); b.style.background=''; b.title='Partager mon écran'; } }catch(e){}
  }
  function mediaLibere(force){
    if(!force && (_vRoom || _vAttente)) return;
    try{ if(_vLocal) _vLocal.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); }catch(e){}
    _vLocal=null; _vCamOn=false;
    try{ if(_vEcran) _vEcran.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); }catch(e){} _vEcran=null;
    try{ ecranEveille(false); }catch(e){}
  }
  /* garde-fou : si plus rien n'est en cours, l'appareil est rendu — micro,
     caméra, ÉCRAN PARTAGÉ et aperçu de la porte compris */
  try{ setInterval(()=>{ try{
    if(_vRoom||_vAttente) return;
    const vivant=(_vLocal&&_vLocal.getTracks().some(t=>t.readyState==='live'))
      || (_vEcran&&_vEcran.getTracks().some(t=>t.readyState==='live'))
      || (typeof _porteFlux!=='undefined'&&_porteFlux&&!document.getElementById('porte-video'));
    if(vivant) toutCouper();

  /* ══ SEUL DANS L'APPEL ══
     Tout le monde est parti. On laisse une petite minute de battement — le
     temps qu'un collègue revienne — puis l'appel se termine : rien ne sert
     de rester en ligne tout seul. */
  function _vSeulDebut(){
    _vSeulStop();
    if(!_vRoom) return;
    let reste=20;
    const dire=()=>{ try{ toast('Tu es seul dans l\'appel — il se fermera dans '+reste+' s si personne ne revient'); }catch(e){} };
    dire();
    _vSeulT=setInterval(()=>{
      reste-=10;
      if(Object.keys(_vPairs).length){ _vSeulStop(); return; }        // quelqu'un est revenu
      if(reste>0){ dire(); return; }
      _vSeulStop();
      try{ toast('Plus personne dans l\'appel — appel terminé'); }catch(e){}
      try{ if(_vRoom) visioFermer(); }catch(e){}
    },10000);
  }
  function _vSeulStop(){ if(_vSeulT){ clearInterval(_vSeulT); _vSeulT=null; } }
  /* ── les réglages d'envoi : l'écran a la priorité et un gros débit ── */
  async function _vRegleEnvoi(p){
    try{
      /* d'abord le choix du codec, SANS attendre : il doit être posé avant
         que l'offre de négociation ne parte, sinon il rate le premier train */
      for(const sn of (p.ecranSendersMoi||[])){
        try{
          const tr=p.pc.getTransceivers().find(t2=>t2.sender===sn);
          if(tr&&tr.setCodecPreferences&&RTCRtpSender.getCapabilities){
            const caps=RTCRtpSender.getCapabilities('video').codecs;
            const vp9=caps.filter(c=>/VP9/i.test(c.mimeType)), autres=caps.filter(c=>!/VP9/i.test(c.mimeType));
            if(vp9.length) tr.setCodecPreferences(vp9.concat(autres));
          }
        }catch(e){}
      }
      for(const sn of (p.ecranSendersMoi||[])){
        try{
          const pr=sn.getParameters(); pr.encodings=pr.encodings&&pr.encodings.length?pr.encodings:[{}];
          pr.encodings[0].maxBitrate=20000000;           // ~20 Mb/s : le 4K respire
          pr.encodings[0].networkPriority='high';
          pr.degradationPreference='maintain-resolution'; // la définition ne baisse JAMAIS
          await sn.setParameters(pr);
        }catch(e){}
      }
      /* la caméra aussi a droit à la qualité : 8 Mb/s, de quoi porter
         du 1080p60 ou du 4K raisonnable */
      for(const sn of p.pc.getSenders()){
        if(!sn.track||sn.track.kind!=='video') continue;
        if((p.ecranSendersMoi||[]).includes(sn)) continue;
        try{ const pr=sn.getParameters(); pr.encodings=pr.encodings&&pr.encodings.length?pr.encodings:[{}];
          pr.encodings[0].maxBitrate=8000000; await sn.setParameters(pr); }catch(e){}
      }
    }catch(e){}
  }
  /* ── le partage d'écran (plusieurs personnes en même temps) ──
     Le clic ouvre d'abord NOTRE menu : « Tout l'écran » ou « Une fenêtre »,
     expliqué en français — et on te dit exactement quel bouton choisir dans
     la fenêtre du navigateur qui suivra. */
  function estSafari(){ return /Safari/i.test(navigator.userAgent||'')&&!/Chrome|Chromium|CriOS|Edg\//i.test(navigator.userAgent||''); }
  function estMac(){ return /Mac/i.test(String(navigator.platform||'')+' '+String(navigator.userAgent||'')); }
  /* ══════════════════════════════════════════════════════════════════
     LA RÉUNION PRO — mélange Zoom + Teams
     Vue Galerie / Intervenant, contour vert sur qui parle, panneau
     Participants, réactions, main levée, plein écran.
     ══════════════════════════════════════════════════════════════════ */
  let _vVue='galerie', _vPinManuel=false, _vReacs={}, _vMainMoi=false;
  let _vParle={}, _vAna={}, _vParleT=null, _vParleurDepuis=0;

  /* ── Galerie / Intervenant ── */
  function visioVue(v){
    _vVue=(v==='intervenant')?'intervenant':'galerie';
    _vPinManuel=false;
    if(_vVue==='galerie') _vGrand=null; else intervenantChoisit(true);
    vueBoutonsMaj(); visioTuiles();

  function vueBoutonsMaj(){
    const g=$('vv-g'), i=$('vv-i');

  /* en vue Intervenant, le grand écran suit : l'écran partagé d'abord,

  function intervenantChoisit(force){
    if(_vVue!=='intervenant'||_vPinManuel||_vMini) return;
    let cible=null;
    for(const [uid,p] of Object.entries(_vPairs)){ if(p.streams&&p.streams.ecran){ cible=uid+'::E'; break; } }
    if(!cible&&_vEcran) cible='moiE';
    if(!cible){ const parle=Object.keys(_vPairs).filter(u=>_vParle[u]); if(parle.length) cible=parle[0]; }
    if(!cible){ const uids=Object.keys(_vPairs); cible=uids.length?uids[0]:'moi'; }

  /* ── plein écran ── */
  function visioPlein(){
    try{
      const v=$('visio');
      if(document.fullscreenElement||document.webkitFullscreenElement){
        (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      } else {
        (v.requestFullscreen||v.webkitRequestFullscreen).call(v);
      }
    }catch(e){ toast('Le plein écran n\u2019est pas disponible ici'); }
  }
  /* ── qui parle : on ÉCOUTE les voix, on entoure de vert ── */
  function parleDemarre(){ parleStop(); _vParleT=setInterval(parleMesure,350); }
  function parleStop(){ if(_vParleT){ clearInterval(_vParleT); _vParleT=null; }
    Object.values(_vAna).forEach(a=>{ try{ a.src.disconnect(); }catch(e){} });
    _vAna={}; _vParle={}; }
  function parleMesure(){
    try{
      if(!_vRoom) return;
      _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
      let change=false;
      const mesure=(cle,flux)=>{
        if(!flux||!flux.getAudioTracks||!flux.getAudioTracks().some(t=>t.enabled&&t.readyState==='live')){
          if(_vParle[cle]){ _vParle[cle]=false; change=true; } return; }
        let a=_vAna[cle];
        if(!a||a.flux!==flux){
          try{ if(a) a.src.disconnect(); }catch(e){}
          try{ const src=_ac.createMediaStreamSource(flux); const an=_ac.createAnalyser();
            an.fftSize=256; src.connect(an);
            a=_vAna[cle]={src:src,an:an,flux:flux,buf:new Uint8Array(an.frequencyBinCount)}; }
          catch(e){ return; }
        }
        a.an.getByteFrequencyData(a.buf);
        let somme=0; for(let i2=0;i2<a.buf.length;i2++) somme+=a.buf[i2];
        const avant=!!_vParle[cle];
        _vParle[cle]=(somme/a.buf.length)>20;
        if(avant!==_vParle[cle]) change=true;
      };
      mesure('moi',_vLocal);
      Object.entries(_vPairs).forEach(([uid,p])=>{ mesure(uid,(p.muetPourMoi||p.micOff)?null:(p.streams&&p.streams.cam)); });
      if(change){ parleApplique(); partsRend(); intervenantChoisit(); }
    }catch(e){}
  }
  /* le contour vert se pose SANS redessiner : rien ne clignote */
  function parleApplique(){
    try{

        const cle=el.dataset.qui;
        el.classList.toggle('parlev',!!(cle&&_vParle[cle]));
      });
    }catch(e){}
  }
  /* ── réactions ── */
  function reactionsOuvre(){

  /* ══ LE PARTAGE D'ÉCRAN, FAÇON DISCORD ══
     UN bouton. Clic → le choix du navigateur → ton écran passe EN DIRECT.
     Re-clic → stop. Aucun menu, aucun bandeau, aucun garde-fou entre toi
     et ton écran. Si tu annules dans le navigateur, un mot, et c'est tout.
     La demande n'expire JAMAIS : le Mac peut prendre son temps. */
  async function visioEcran(){
    if(_vGenre==='appel'){ if(_vEcran) visioEcranStop(); return; }   // pas de partage en appel
    if(_vEcran){ visioEcranStop(); return; }                         // re-clic : stop
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)){
      toast('Cet appareil ne sait pas partager son écran'); return; }

    const dem=++_vEcranDem;      // cette demande-ci ; une plus récente la périme
    let dit=false;               // UN SEUL message par clic, jamais deux
    const dire=(m,j)=>{ if(dem!==_vEcranDem) return;
      if(!dit){ dit=true; toast(m); }
      if(j!==undefined){ try{ tmPush('erreur','Partage d\u2019\u00e9cran : '+m,String(j||''),'',0); }catch(_){} } };

    /* PENDANT QUE LE NAVIGATEUR ET LE MAC POSENT LEURS QUESTIONS, le bouton
       pulse en bleu : on voit que l'application attend, sans aucun message. */
    const bAtt=$('visio-ecran'); if(bAtt) bAtt.classList.add('attend');
    const finAttente=()=>{ const b2=$('visio-ecran'); if(b2) b2.classList.remove('attend'); };

    /* ══ LE MAC QUI NE REND PAS LA MAIN ══
       Défaut connu de Safari sur Mac (WebKit 259823, revenu dans Safari 18.0) :
       après qu'on a désigné l'écran, le sélecteur du système ne prévient pas
       toujours Safari — la demande reste alors en l'air une minute entière,
       sans rien afficher. C'était ÇA, « il ne se passe rien ».
       On ne coupe RIEN : au bout de 12 secondes on le DIT, et on donne le
       geste qui débloque (recliquer). Si la réponse finit par arriver, même
       une minute plus tard, le partage démarre normalement. */
    let muet=setTimeout(()=>{ muet=null;
      if(dem===_vEcranDem && !_vEcran)
        dire('Le Mac n\u2019a pas répondu — reclique sur Partager','pendante 12s · '+(navigator.userAgent||'').slice(-60));
    },12000);
    const finMuet=()=>{ if(muet){ clearTimeout(muet); muet=null; } };

    let flux=null;
    try{
      flux=await navigator.mediaDevices.getDisplayMedia(estSafari()
        ? {video:true}                                               // Safari refuse le moindre réglage
        : {video:{width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30,max:60}},audio:false});
    }catch(e){
      const nom=(e&&e.name)||'';
      dire(nom==='NotAllowedError'?'Partage annulé':'Partage impossible ('+(nom||'?')+')',(e&&e.message)||'');
      return;
    }finally{ finMuet(); finAttente(); }

    /* PLUS JAMAIS DE SORTIE MUETTE après un partage accordé */
    if(dem!==_vEcranDem){
      try{ flux.getTracks().forEach(t=>t.stop()); }catch(e){}
      try{ tmPush('erreur','Partage d\u2019\u00e9cran : réponse périmée ignorée','','',0); }catch(_){}
      return; }
    if(!_vRoom){
      try{ flux.getTracks().forEach(t=>t.stop()); }catch(e){}
      dire('Partage impossible : la réunion s\u2019est fermée','_vRoom null au retour');
      return; }

    let souci='';
    try{
      _vEcran=flux;
      /* « detail » : le texte reste NET ; si le réseau manque, on perd des
         images par seconde, jamais de la définition */
      try{ flux.getVideoTracks().forEach(t=>{ t.contentHint='detail'; }); }catch(e){}
      const b=$('visio-ecran'); if(b){ b.classList.remove('attend'); b.style.background='#e01e3c'; b.title='Arrêter le partage'; }
      flux.getVideoTracks().forEach(t=>{ t.onended=()=>visioEcranStop(); });
      Object.values(_vPairs).forEach(p=>{ try{ flux.getTracks().forEach(t=>p.ecranSendersMoi=(p.ecranSendersMoi||[]).concat([p.pc.addTrack(t,flux)])); _vRegleEnvoi(p); }catch(e){} });
      dcTous({t:'ecranId',id:flux.id});
      try{ _vDire({type:'ecran',eid:flux.id}); }catch(e){}
      if(!_vOrdre.includes('moiE')) _vOrdre.push('moiE');
      _vGrand='moiE'; _vPinManuel=true;
      visioTuiles();
    }catch(e){
      souci=(e&&e.name)||'erreur';
      try{ tmPush('erreur','Partage d\u2019\u00e9cran : affichage ('+souci+')',String((e&&e.message)||''),'',0); }catch(_){}
    }
    dit=true;   // le partage est parti : le succès l'emporte sur tout message précédent
    toast(souci?'\ud83d\udd34 Écran EN DIRECT (affichage à rafraîchir)':'\ud83d\udd34 Ton écran est EN DIRECT');
  }
  function visioEcranStop(){
    if(!_vEcran) return;
    _vEcranDem++;   // une demande encore en l'air ne réactivera pas le partage
    try{ _vEcran.getTracks().forEach(t=>t.stop()); }catch(e){}
    Object.values(_vPairs).forEach(p=>{ (p.ecranSendersMoi||[]).forEach(sn=>{ try{ p.pc.removeTrack(sn); }catch(e){} }); p.ecranSendersMoi=[]; });
    dcTous({t:'ecranFin',id:_vEcran.id});
    try{ _vDire({type:'ecranfin',eid:_vEcran.id}); }catch(e){}
    _vEcran=null; delete _vNotes[ME.uid];
    if(_vGrand==='moiE') _vGrand=null;
    _vOrdre=_vOrdre.filter(x=>x!=='moiE');
    const b=$('visio-ecran'); if(b){ b.classList.remove('attend'); b.style.background=''; b.title='Partager mon écran'; }
    visioTuiles(); toast('Partage d\'écran arrêté');
  }
  /* ── les tuiles : ordre, grand écran, sourdines ── */
  function _vListeTuiles(){
    const l=[];
    l.push({id:'moi',nom:(USER&&USER.name)||'Moi',moi:true,ecran:false,stream:_vLocal});
    if(_vEcran) l.push({id:'moiE',nom:((USER&&USER.name)||'Moi'),moi:true,ecran:true,stream:_vEcran,cible:ME.uid});
    Object.entries(_vPairs).forEach(([uid,p])=>{
      l.push({id:uid,nom:p.nom||'Invité',moi:false,ecran:false,stream:p.streams.cam,uid:uid});
      if(p.streams.ecran) l.push({id:uid+'::E',nom:p.nom||'Invité',moi:false,ecran:true,stream:p.streams.ecran,uid:uid,cible:uid});
    });
    l.forEach(t=>{ if(!_vOrdre.includes(t.id)) _vOrdre.push(t.id); });
    _vOrdre=_vOrdre.filter(id=>l.some(t=>t.id===id));
    return _vOrdre.map(id=>l.find(t=>t.id===id));
  }
  function visioBouge(id,dir){ const i=_vOrdre.indexOf(id); const j=i+dir;
    if(i<0||j<0||j>=_vOrdre.length) return;
    const t=_vOrdre[i]; _vOrdre[i]=_vOrdre[j]; _vOrdre[j]=t; visioTuiles(); }
  function visioGrand(id){ _vGrand=(id&&_vGrand!==id)?id:null; _vPinManuel=!!_vGrand; visioTuiles(); }
  function visioSourdine(uid){ const p=_vPairs[uid]; if(!p) return;
    p.muetPourMoi=!p.muetPourMoi; visioSons(); visioTuiles();
    toast(p.muetPourMoi?'🔈 Son coupé pour toi seulement':'Son rétabli'); }
  function visioMuteLui(uid){ const p=_vPairs[uid]; if(!p) return;
    dcVers(uid,{t:'muteToi',par:(USER&&USER.name)||''}); toast('Demande envoyée — son micro va se couper'); }
  /* ══ LE SON DES AUTRES ══
     Il vit À PART de l'image. Avant, il était refait à chaque rafraîchissement
     de l'écran : la voix se coupait une fraction de seconde à chaque fois.
     Maintenant chaque personne a son haut-parleur à elle, posé une fois. */
  function visioSons(){
    const z=$('visio-audios'); if(!z) return;
    Object.entries(_vPairs).forEach(([uid,p])=>{
      const id='pa-'+uid.replace(/[^a-zA-Z0-9]/g,'_');
      let a=$(id);
      if(!a){ a=document.createElement('audio'); a.id=id; a.autoplay=true;
        a.setAttribute('playsinline',''); z.appendChild(a); }
      const flux=p.streams&&p.streams.cam;
      if(flux&&a.srcObject!==flux){ try{ a.srcObject=flux; }catch(e){} }
      a.muted=!!p.muetPourMoi;
      const pr=a.play&&a.play(); if(pr&&pr.catch) pr.catch(()=>{});
    });
    /* la personne est partie : on retire son haut-parleur */
    [...z.querySelectorAll('audio')].forEach(a=>{
      const uid=Object.keys(_vPairs).find(u=>('pa-'+u.replace(/[^a-zA-Z0-9]/g,'_'))===a.id);
      if(!uid){ try{ a.srcObject=null; }catch(e){} a.remove(); }
    });
  }
  function visioTuiles(){
    const g=$('visio-grille'); if(!g) return;
    visioSons();
    const liste=_vListeTuiles();
    const grand=(!_vMini&&_vGrand&&liste.some(t=>t.id===_vGrand))?_vGrand:null;
    /* les outils de dessin servent dès qu'un écran est à l'image — plus
       besoin de l'épingler d'abord pour les voir apparaître */
    const outils=$('visio-outils'); if(outils) outils.style.display=(!_vMini&&liste.some(t=>t.ecran))?'flex':'none';
    if(grand||_vMini){ g.style.display='flex'; g.style.flexDirection='column'; g.style.alignContent=''; }
    else { g.style.display='grid'; g.style.alignContent='center'; }
    g.style.position='relative';
    const tuile=(t,taille)=>{
      const camOff=t.moi&&!t.ecran
        ? (!_vLocal||!_vLocal.getVideoTracks().some(x=>x.enabled&&x.readyState==='live'))
        : (t.ecran ? !(t.stream&&t.stream.getVideoTracks&&t.stream.getVideoTracks().length)
                   : ((t.uid&&_vPairs[t.uid]&&_vPairs[t.uid].camOff===true) || !(t.stream&&t.stream.getVideoTracks&&t.stream.getVideoTracks().length)));
      const ctl=[];
      if(_vMini) return `<div style="position:relative;flex:1;min-height:0;overflow:hidden;background:#141a26">
        ${camOff?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">

          :`<video id="vt-${t.id.replace(/[^a-zA-Z0-9]/g,'_')}" autoplay playsinline ${t.moi?'muted':''} style="width:100%;height:100%;object-fit:cover;${(t.moi&&!t.ecran&&_vFace==='user')?'transform:scaleX(-1)':''}"></video>`}
        <span style="position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;z-index:2">${esc((t.nom||'').split(' ')[0]||'')}</span>
      </div>`;
      ctl.push(`<button onclick="event.stopPropagation();visioBouge('${t.id}',-1)" title="Avancer">‹</button>`);

      const micCoupe = t.ecran ? false : (t.moi
        ? (_vLocal&&!_vLocal.getAudioTracks().some(x=>x.enabled))
        : !!(t.uid&&_vPairs[t.uid]&&_vPairs[t.uid].micOff));
      const cleQui=t.ecran?'':(t.moi?'moi':(t.uid||''));
      const mainLevee=!t.ecran&&(t.moi?_vMainMoi:!!(t.uid&&_vPairs[t.uid]&&_vPairs[t.uid].main));
      const reac=_vReacs[t.moi?'moi':(t.uid||'')];
      return `<div id="tl-${t.id.replace(/[^a-zA-Z0-9]/g,'_')}" data-qui="${cleQui}" class="tuilev${(cleQui&&_vParle[cleQui])?' parlev':''}" style="position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1a2338,#10161f);${t.ecran?'display:flex;align-items:center;justify-content:center;':''}${taille}" onclick="visioGrand('${t.id}')">
        ${mainLevee?'<span style="position:absolute;left:8px;top:8px;z-index:3;background:#ffb454;color:#3a2f12;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px">✋ Main levée</span>':''}
        ${(reac&&!t.ecran)?`<span style="position:absolute;right:10px;bottom:34px;z-index:3;font-size:32px">${reac.emo}</span>`:''}
        ${micCoupe?`<span style="position:absolute;left:8px;top:8px;z-index:3;background:#e05252;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px">🔇 Micro coupé</span>`:''}
        ${camOff?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
            <div style="width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;${avatarStyle(t.nom)}">${ini(t.nom)}</div></div>`
          :`<video id="vt-${t.id.replace(/[^a-zA-Z0-9]/g,'_')}" autoplay playsinline ${t.moi?'muted':''} style="${(_vZoom100&&t.ecran&&grand===t.id)?'width:auto;height:auto;min-width:0;min-height:0':'width:100%;height:100%'};object-fit:${t.ecran?'contain':'cover'};${(t.moi&&!t.ecran&&_vFace==='user')?'transform:scaleX(-1)':''}"></video>`}
        ${t.ecran?`<canvas class="vnote" data-cible="${t.cible}" style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair"></canvas>`:''}
        <span class="nomv" style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;z-index:2;display:flex;align-items:center;gap:6px">${t.ecran?'<b style="background:#e01e3c;border-radius:6px;padding:1px 7px;font-size:9.5px;letter-spacing:.05em;box-shadow:0 0 10px rgba(224,30,60,.5)">EN DIRECT</b>':''}${esc((t.nom||'').split(' ')[0]||'')}${t.moi?' (toi)':''}</span>
        <span class="vctl" style="position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:3">${ctl.join('')}</span>
      </div>`; };
    /* l'appel est garé et rien d'autre n'est en cours : on le dit en grand */
    if(!_vRoom && _vAttente){
      const v=$('visio'); if(v) v.classList.add('tel');
      g.style.display='block';
      g.innerHTML=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0e16">
        <div style="width:118px;height:118px;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;${avatarStyle(_vAttente.nom||'')}">${ini(_vAttente.nom||'')}</div>

        <button class="btn" style="margin-top:8px" onclick="visioReprendre()">▶︎ Reprendre l'appel</button></div>`;

      && liste.filter(t=>!t.moi&&!t.ecran).length<=1 && !liste.some(t=>t.ecran);
    { const v=$('visio'); if(v) v.classList.toggle('tel',!!tel); }
    if(tel){
      let lui=liste.find(t=>!t.moi&&!t.ecran);
      let moi=liste.find(t=>t.moi&&!t.ecran);

      if(_vEchange&&lui&&moi){ const t2=lui; lui=moi; moi=t2; }
      const luiOff = !lui || (lui.moi
        ? (!_vLocal||!_vLocal.getVideoTracks().some(x=>x.enabled&&x.readyState==='live'))
        : ((lui.uid&&_vPairs[lui.uid]&&_vPairs[lui.uid].camOff===true) || !(lui.stream&&lui.stream.getVideoTracks&&lui.stream.getVideoTracks().length)));
      const moiOff = moi&&moi.moi
        ? (!_vLocal||!_vLocal.getVideoTracks().some(x=>x.enabled&&x.readyState==='live'))
        : !(moi&&moi.stream&&moi.stream.getVideoTracks&&moi.stream.getVideoTracks().length&&!(moi.uid&&_vPairs[moi.uid]&&_vPairs[moi.uid].camOff===true));
      const attente = lui&&lui.uid&&_vPairs[lui.uid]&&_vPairs[lui.uid].enAttente;
      g.style.display='block';

            :`<div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%, ${_vAvatarFond((lui&&lui.nom)||'')} 0%, #0a0e16 72%)"></div>

  function miniGlisse(el){

  /* ══ ON NE DESSINE QUE CE QU'ON REGARDE ══
     Une conversation d'équipe compte vite des centaines de messages. Les
     redessiner tous à chaque nouveau message bloquait l'écran un tiers de
     seconde. On n'affiche que les plus récents ; les plus anciens se
     chargent d'un bouton, sans jamais peser sur le reste. */
  let _fenetre=80;
  function plusAnciens(){ const s=$('stream'); const h=s?s.scrollHeight:0;
    _fenetre+=120; renderStream(true);
    if(s){ try{ s.scrollTop=s.scrollHeight-h; }catch(e){} } }
  function renderStream(garde){
    const s=$('stream'); if(!s) return;
    /* où en est la lecture ? (avant de toucher au contenu) */
    const enBas = s.scrollHeight-s.scrollTop-s.clientHeight < 130;
    const posAvant = s.scrollTop, hautAvant = s.scrollHeight;
    const q=(($('chsearch')||{}).value||'').trim().toLowerCase();
    let msgs = q? _curMsgs.filter(x=>(x.m.text||'').toLowerCase().includes(q)) : _curMsgs;
    const clr=_curCh?getClearedAt(_curCh.id):0; if(clr) msgs=msgs.filter(x=>x.d.getTime()>clr);
    if(_block.size) msgs=msgs.filter(x=>!isBlocked(x.m.uid));
    if(_starFilter) msgs=msgs.filter(x=>_star.has(x.id));
    /* on garde les plus récents : au-delà, un bouton ouvre la suite */
    let coupes=0;
    if(!q && msgs.length>_fenetre){ coupes=msgs.length-_fenetre; msgs=msgs.slice(coupes); }
    let html='',lastDay='';
    if(coupes) html+=`<div style="text-align:center;padding:10px 0"><button class="btn ghost sm" onclick="plusAnciens()">Voir les ${coupes} message${coupes>1?'s':''} plus anciens</button></div>`;
    const vis=msgs.filter(x=>!_hidden.has(x.id)); let lastMineId=null; for(let i=vis.length-1;i>=0;i--){ if(vis[i].m.uid===ME.uid){ lastMineId=vis[i].id; break; } }
    const isDM=_curCh&&(''+_curCh.id).indexOf('dm_')===0;
    msgs.forEach(({id,m,d})=>{
      if(_hidden.has(id)) return;

      let body='';
      if(m.replyTo) body+=`<div style="border-left:3px solid currentColor;padding:3px 8px;margin-bottom:5px;font-size:12.5px;opacity:.85;border-radius:4px;background:rgba(127,127,127,.14)"><b>${esc(m.replyTo.name||'')}</b><br>${esc((m.replyTo.text||'[média]').slice(0,90))}</div>`;
      body+=m.text?linkify(highlightMentions(esc(m.text),m)):'';
      if(m.img) body+=`<img src="${m.img}" onclick="event.stopPropagation();window.open(this.src)">`;
      if(m.audio) body+=`<audio class="voc" controls src="${m.audio}" style="max-width:215px;display:block;margin-top:6px;height:38px" onclick="event.stopPropagation()" onplay="vocSeul(this)" onended="vocSuivant(this)"></audio>`;
      if(m.locDem) body+=locDemHtml(id,m);
      if(m.loc) body+=locHtml(id,m);
      if(m.ack) body+=ackHtml(id,m);
      if(m.poll) body+=pollHtml(id,m);
      if(m.event) body+=eventHtml(id,m);
      if(m.sticker) body+=`<div style="font-size:54px;line-height:1.05">${esc(m.sticker)}</div>`;
      if(m.file){ body+=`<div class="filechip" onclick="event.stopPropagation();openFile('${id}')">${ic('file',16)} ${esc(m.file.name)}</div>`; }
      let reacts=''; if(m.reactions){ const ps=Object.entries(m.reactions).filter(([e,a])=>a&&a.length).map(([e,a])=>`<span style="background:rgba(127,127,127,.2);border-radius:100px;padding:1px 7px;font-size:12px">${e} ${a.length}</span>`); if(ps.length) reacts=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">${ps.join('')}</div>`; }
      const starTag=_star.has(id)?'<span style="color:#f5c518;font-size:10px"> ★</span>':'';
      const ephTag=m.exp?'<span style="font-size:10px;opacity:.6" title="Éphémère"> ⏱</span>':'';
      const enAttente=!!(m.programmeAt&&m.programmeAt>Date.now());
      html+=`<div class="m ${mine?'me':'them'}${enAttente?' attente':''}" data-mid="${id}" onclick="${enAttente?`progModifier('${id}')`:`msgTap('${id}')`}" style="cursor:pointer${enAttente?';opacity:.72;border:1px dashed currentColor':''}">${enAttente?`<div style="font-size:10.5px;font-weight:800;letter-spacing:.05em;margin-bottom:3px">⏰ PROGRAMMÉ · ${esc(new Date(m.programmeAt).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))} · ✏️ modifier</div>`:''}${mine?'':`<div class="who">${esc(m.name||'')}</div>`}${body}${reacts}${m.fwd?'<span style="font-size:9px;opacity:.55">↪ transféré</span>':''}${m.edited?'<span style="font-size:9px;opacity:.55"> · modifié</span>':''}<div class="t">${time}${ephTag}${starTag}</div></div>`;
      if(id===lastMineId && readReceiptsOn()){ const mt=d.getTime();
        const rd=Object.keys(_reads).filter(u=>u!==ME.uid && (_reads[u]||0)>=mt-2000).length;
        const rtxt=rd? (isDM?'Vu':'Vu par '+rd) : 'Envoyé';
        html+=`<div onclick="${rd&&!isDM?`quiALu(${mt})`:''}" style="align-self:flex-end;font-size:10.5px;color:var(--t3);margin:-3px 4px 2px${rd&&!isDM?';cursor:pointer;text-decoration:underline dotted':''}">${rtxt}</div>`; }
    });

      html+=`<div class="m me" style="opacity:.65;border:1px dashed currentColor" onclick="event.stopPropagation()">${esc(x.text)}

    }); } }catch(e){}
    s.innerHTML=html||(q?'<p class="muted center" style="margin:auto">Aucun résultat.</p>':'<p class="muted center" style="margin:auto">Aucun message. Dites bonjour 👋</p>');

  function locTuile(la,lo,z){ z=z||16;
    const x=Math.floor((lo+180)/360*Math.pow(2,z));

    const y=Math.floor((1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*Math.pow(2,z));

  function pollHtml(id,m){ const p=m.poll||{opts:[]}; const v=_pollVotes[id];

  /* Qui a répondu quoi : chaque personne avec sa réponse, et ceux qui n'ont

  // ---- Infos / gestion de groupe ----

  /* Le PDF : une page propre, datée, avec l'auteur de chaque message —
     de quoi garder une trace d'un échange (consignes, litige client…). */
  function exportChatPdf(){ if(!_curMsgs.length) return;
    const nom=(_curCh&&_curCh.name)||'Conversation';

    const lignes=_curMsgs.map(({m,d})=>{

      <h1>${esc(nom)}</h1>

      ${lignes}

    w.document.close();
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },400);

  let _progAttente=[];

  async function locAdresse(la,lo){

      const j=await r.json(); const a=j&&j.address||{};
      const rue=[a.house_number,a.road].filter(Boolean).join(' ');
      const ville=[a.postcode,a.city||a.town||a.village||a.municipality].filter(Boolean).join(' ');
      return [rue,ville].filter(Boolean).join(', ')||(j&&j.display_name?String(j.display_name).split(',').slice(0,3).join(', '):'');
    }catch(e){ return ''; }
  }

  async function liveStart(minutes){
    if(!_curCh) return;

    closeSheet();

      const la=+p.coords.latitude.toFixed(5), lo=+p.coords.longitude.toFixed(5);
      const jusqu=Date.now()+minutes*60000;
      const adresse=await locAdresse(la,lo);
      try{
        /* exp : à l'heure dite, le message disparaît de chez tout le monde */
        const ref=await addMsg({uid:ME.uid,name:USER.name||ME.email,loc:{la:la,lo:lo,adresse:adresse,maj:Date.now()},live:{jusqu:jusqu},exp:jusqu,ts:FV()});
        _liveId=ref.id; _liveCh=_curCh.id; _liveJusqu=jusqu; _liveAlerte=false;
        toast('🔴 Position partagée pendant '+minutes+' min — compte à rebours lancé');
        if(_liveT) clearInterval(_liveT);
        _liveT=setInterval(()=>{ liveAlerteCheck(); liveMaj(); },10000);
      }catch(e){ opAlerte('Erreur : '+((e&&e.message)||e)); }
    }, ()=>toast('Position refusée ou indisponible.'), {enableHighAccuracy:true,timeout:8000});
  }

    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p=>{
      const la=+p.coords.latitude.toFixed(5), lo=+p.coords.longitude.toFixed(5);
      try{ chanCol().doc(_liveCh).collection('messages').doc(_liveId)
        .update({'loc.la':la,'loc.lo':lo,'loc.maj':Date.now()}); }catch(e){}
    },()=>{},{enableHighAccuracy:true,timeout:8000});
  }
  /* Il s'arrête tout seul quand on ferme l'application : les autres voient

  try{ window.addEventListener('pagehide',()=>{ try{ if(_liveId){
      const c=_liveCh,i=_liveId; if(_liveT) clearInterval(_liveT);
      navigator.sendBeacon && 0; chanCol().doc(c).collection('messages').doc(i).update({'live.jusqu':Date.now()});

  /* ══ L'APPAREIL PHOTO INTÉGRÉ ══
     Sur ordinateur et tablette, le bouton « Caméra » n'ouvrait qu'un
     explorateur de fichiers : la webcam n'était jamais utilisée. Ici on
     affiche l'image en direct, on prend la photo, on la revoit, on l'envoie.

  let _camFlux=null, _camFace='environment', _camData='';
  function camDispo(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); }

  async function camOuvrir(){
    if(!_curCh) return;
    /* téléphone : l'appareil du système fait mieux (mise au point, flash) */
    if(camTactile()||!camDispo()){ $('campick').click(); return; }
    const boite=$('camera'); const _o=boite.classList.contains('open');
    boite.classList.add('open'); if(!_o) pushBack();

      const m=String((e&&e.name)||e);
      opAlerte(/NotAllowed|Permission/i.test(m)

        : (/NotFound|Devices/i.test(m) ? "Aucune caméra détectée sur cet appareil." : 'Caméra indisponible : '+m));

  function camMode(m){
    const prise=m==='prise';
    $('cam-video').style.display=prise?'':'none';

    $('cam-prendre').style.display=prise?'':'none';

  function camPrendre(){
    const v=$('cam-video'); if(!v||!v.videoWidth) return;
    let w=v.videoWidth,h=v.videoHeight; const mx=1000;
    if(w>mx||h>mx){ if(w>h){ h=h*mx/w; w=mx; } else { w=w*mx/h; h=mx; } }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(v,0,0,w,h);

      $('cam-video').srcObject=_camFlux; }catch(e){}

  function camFermer(){
    try{ if(_camFlux) _camFlux.getTracks().forEach(t=>t.stop()); }catch(e){}

  /* Le fichier reçu est stocké en données brutes : on le reconstruit en vrai
     fichier pour que le téléphone sache l'ouvrir. */
  function fichierBlob(f){ const morceaux=String(f.data||'').split(',');
    const mime=((morceaux[0]||'').match(/data:([^;]+)/)||[])[1]||f.type||'application/octet-stream';
    const bin=atob(morceaux[1]||''); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

  async function openFile(id){ const f=_files[id]; if(!f) return; const pdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name||'');
    const souris=(function(){ try{ return window.matchMedia('(hover: hover) and (pointer: fine)').matches; }catch(e){ return true; } })();
    if(pdf && souris){ $('viewer-name').textContent=f.name||'Document'; $('viewer-frame').src=f.data; const _vw=$('viewer').classList.contains('open'); $('viewer').classList.add('open'); if(!_vw) pushBack(); return; }
    try{
      const blob=fichierBlob(f);
      /* téléphone / tablette : la fenêtre de partage du système —
         « Ouvrir dans… », « Enregistrer dans Fichiers »… ça marche partout */
      if(!souris && navigator.canShare){ try{
        const fichier=new File([blob],f.name||'fichier',{type:blob.type});
        if(navigator.canShare({files:[fichier]})){ await navigator.share({files:[fichier],title:f.name||'Fichier'}); return; }
      }catch(e){ if(e&&e.name==='AbortError') return; } }
      const url=URL.createObjectURL(blob);
      const w=window.open(url,'_blank');
      if(!w){ const a=document.createElement('a'); a.href=url; a.download=f.name||'fichier'; document.body.appendChild(a); a.click(); a.remove(); }
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} },60000);
    }catch(e){ toast('Ouverture impossible : '+((e&&e.message)||e)); } }

  async function inviteSend(){
    const raw=($('inv-q').value||'').trim(); if(!raw) return invErr('Entrez un numéro ou un identifiant.');
    const btn=$('inv-btn'); if(btn) btn.disabled=true;
    const isPhone=/^[0-9+ .]{6,}$/.test(raw);
    try{
      const snap = isPhone ? await fs.collection('op_users').where('phone','==',raw).limit(1).get() : await fs.collection('op_users').where('handle','==',handleOf(raw)).limit(1).get();
      if(snap.empty){ invErr("Aucun utilisateur avec ceci. La personne doit d'abord créer un compte (onglet Perso)."); if(btn)btn.disabled=false; return; }
      const u=snap.docs[0].data();
      if(u.uid===ME.uid){ invErr('C\'est vous 🙂'); if(btn)btn.disabled=false; return; }
      const m=await fs.collection('op_companies').doc(COMP.id).collection('members').doc(u.uid).get();
      if(m.exists){ invErr((u.name||'Cette personne')+' fait déjà partie de l\'entreprise.'); if(btn)btn.disabled=false; return; }

      await fs.collection('op_companies').doc(COMP.id).collection('members').doc(u.uid).set({uid:u.uid,name:u.name||'',phone:u.phone||'',role:'classique',ts:FV()});

  async function addMember(){
    const errBox=m=>{ const el=$('amerr'); if(el) el.innerHTML='<div class="err">'+esc(m)+'</div>'; };
    const name=(($('am-prenom').value||'').trim()+' '+($('am-nom').value||'').trim()).trim();
    const ident=($('am-login').value||'').trim().toLowerCase().replace(/[^a-z0-9._@-]/g,'');

    if(!name||ident.length<3){ errBox('Indiquez un prénom et un identifiant (≥3 caractères).'); return; }
    if(pass.length<6){ errBox('Mot de passe : 6 caractères minimum.'); return; }
    const email=loginEmail(ident); const btn=$('am-btn'); if(btn) btn.disabled=true; let sec=null;
    try{
      sec=firebase.initializeApp(FB_CONFIG,'sec'+Date.now());
      let cred; try{ cred=await sec.auth().createUserWithEmailAndPassword(email,pass); }
      catch(e){ if((e.code||'')==='auth/email-already-in-use') errBox('Cet identifiant existe déjà.'); else errBox(e.message||'Erreur'); if(btn)btn.disabled=false; await sec.delete(); return; }
      const sfs=sec.firestore();
      const phone=($('am-phone')&&$('am-phone').value||'').trim();
      /* l'identifiant (handle) DOIT être enregistré : sans lui, la personne est
         introuvable par identifiant (ajout dans une entreprise, recherche de contact). */
      await sfs.collection('op_users').doc(cred.user.uid).set({uid:cred.user.uid,email,name,handle:ident,phone,role:'classique',companyId:COMP.id,companyName:COMP.name});
      await sfs.collection('op_companies').doc(COMP.id).collection('members').doc(cred.user.uid).set({uid:cred.user.uid,name,phone,role:'classique',ts:FV()});
      await sec.auth().signOut(); await sec.delete(); sec=null; _lastCreds={ident,pass,company:COMP.name};
      openSheet(`<div class="ok" data-titre="Compte créé">✅ Compte créé pour <b>${esc(name)}</b>.</div>
        <p class="muted" style="margin:10px 0">Accès à donner à l'employé :</p>
        <div style="background:var(--card2);border:1px solid var(--brd2);border-radius:12px;padding:14px;font-size:14px;line-height:1.7">Identifiant : <b>${esc(ident)}</b><br>Mot de passe : <b>${esc(pass)}</b></div>
        <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="shareCreds()">📤 Partager</button><button class="btn ghost" style="flex:1" onclick="copyCreds(this)">📋 Copier</button></div>
        <button class="btn ghost block" style="margin-top:10px" onclick="closeSheet();showView('cont')">← Retour aux contacts</button>`);
    }catch(e){ errBox(e.message||'Erreur'); if(btn)btn.disabled=false; try{ if(sec) await sec.delete(); }catch(_){} }
  }
  function credsText(){ if(!_lastCreds) return ''; return `Vos accès OP MESSAGES — ${_lastCreds.company}\nIdentifiant : ${_lastCreds.ident}\nMot de passe : ${_lastCreds.pass}\n\nConnexion : https://teamop.fr/messages.html`; }
  async function shareCreds(){ const t=credsText(); if(!t) return; if(navigator.share){ try{ await navigator.share({title:'Accès OP MESSAGES',text:t}); }catch(e){} } else copyCreds(); }
  function copyCreds(btn){ const t=credsText(); if(!t) return; if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>{ if(btn){ const o=btn.textContent; btn.textContent='✅ Copié'; setTimeout(()=>btn.textContent=o,1600);} }); } else opAlerte(t); }

  /* On découpe ce qu'on reçoit : le titre monte dans la barre, les boutons
     marqués « data-pied » descendent dans le pied, le reste défile au milieu.
     Le titre est pris sur « data-titre », sinon sur le <h3> de tête. */
  function openSheet(html){
    const sh=$('sheet'), wasOpen=sh.classList.contains('open');
    const tmp=document.createElement('div'); tmp.innerHTML=html;
    let titre='';
    const prem=tmp.firstElementChild;
    if(prem&&prem.getAttribute&&prem.getAttribute('data-titre')){ titre=prem.getAttribute('data-titre'); prem.removeAttribute('data-titre'); }
    else { const h3=tmp.querySelector('h3');
      if(h3&&h3.parentElement===tmp&&!h3.previousElementSibling){ titre=(h3.textContent||'').trim(); h3.remove(); } }
    try{ titre=titre.replace(/^[^\p{L}\p{N}]+/u,'').trim(); }catch(e){}   // pas d'emoji dans la barre de titre
    const pied=tmp.querySelector('[data-pied]');
    if(pied){ pied.removeAttribute('data-pied'); pied.classList.add('sh-actions'); pied.remove(); }
    $('sheet-c').innerHTML=`<div class="sh-bar"><b>${esc(titre)}</b>
        <span class="sh-x" onclick="closeSheet()" title="Fermer">✕</span></div>
      <div class="sh-body" id="sheet-body"></div>
      <div class="sh-pied" id="sheet-pied"></div>`;
    const corps=$('sheet-body');
    while(tmp.firstChild) corps.appendChild(tmp.firstChild);
    /* le pied porte les actions ; s'il n'y en a pas, il porte « Fermer »
       (la croix, Échap et le clic à côté ferment de toute façon) */
    if(pied) $('sheet-pied').appendChild(pied);
    else $('sheet-pied').innerHTML='<button class="btn ghost sh-fermer" onclick="closeSheet()">Fermer</button>';
    corps.scrollTop=0;
    sh.classList.add('open'); if(!wasOpen) pushBack();
  }
  /* ══ NOS FENETRES ══
     À la place des boîtes grises du navigateur — celles qui écrivent
     « teamop.fr indique… » en haut et qui n'ont pas la tête de
     l'application. Même look partout, sur téléphone comme sur ordinateur.
     On les attend avec « await », exactement comme avant. */
  let _dlgFerme=null;
  function _dlgOuvre(html,alaFin){
    const z=$('opdlg'), c=$('opdlg-c'); if(!z||!c) return;
    c.innerHTML=html; z.classList.add('open');
    if(alaFin) try{ alaFin(); }catch(e){}
  }
  function _dlgFin(){ const z=$('opdlg'); if(z) z.classList.remove('open'); _dlgFerme=null; document.removeEventListener('keydown',_dlgTouche,true); }
  function _dlgTouche(e){
    if(!_dlgFerme) return;
    if(e.key==='Escape'){ e.preventDefault(); _dlgFerme(null); }
    else if(e.key==='Enter'&&!e.shiftKey){ const t=e.target&&e.target.tagName; if(t==='TEXTAREA') return;
      e.preventDefault(); const b=$('opdlg-ok'); if(b) b.click(); }
  }
  function _dlgLance(html,rendre,apres){
    return new Promise(res=>{
      _dlgFerme=(v)=>{ _dlgFin(); res(v); };
      _dlgOuvre(html,apres);
      document.addEventListener('keydown',_dlgTouche,true);
      window._dlgRend=rendre;
    });
  }
  function _dlgRepond(v){ if(_dlgFerme) _dlgFerme(v); }
  /* un message à lire : un seul bouton */
  function opAlerte(msg,titre){
    return _dlgLance(
      `<div class="opdlg-t">${esc(titre||'OP MESSAGES')}</div>
       <div class="opdlg-m">${esc(String(msg==null?'':msg))}</div>
       <div class="opdlg-b"><button class="btn" id="opdlg-ok" onclick="_dlgRepond(true)">J'ai compris</button></div>`,
      null, ()=>{ const b=$('opdlg-ok'); if(b) b.focus(); });
  }
  /* une question : oui ou non */
  function opConfirme(msg,o){
    o=o||{};
    return _dlgLance(
      `<div class="opdlg-t">${esc(o.titre||'Confirmer')}</div>
       <div class="opdlg-m">${esc(String(msg==null?'':msg))}</div>
       <div class="opdlg-b">
         <button class="btn ghost" onclick="_dlgRepond(false)">${esc(o.non||'Annuler')}</button>
         <button class="btn" id="opdlg-ok" style="${o.danger?'background:#e05252':''}" onclick="_dlgRepond(true)">${esc(o.oui||'Confirmer')}</button></div>`,
      null, ()=>{ const b=$('opdlg-ok'); if(b) b.focus(); })
      .then(v=>v===true);
  }
  /* une saisie : du texte, un nombre, un code */
  function opSaisie(msg,valeur,o){
    o=o||{};
    const champ = o.multi
      ? `<textarea id="opdlg-in" placeholder="${esc(o.placeholder||'')}">${esc(String(valeur==null?'':valeur))}</textarea>`
      : `<input id="opdlg-in" type="${esc(o.type||'text')}" ${o.max?('maxlength="'+(+o.max)+'"'):''} ${o.chiffres?'inputmode="numeric"':''}
           placeholder="${esc(o.placeholder||'')}" value="${esc(String(valeur==null?'':valeur))}">`;
    return _dlgLance(
      `<div class="opdlg-t">${esc(o.titre||'OP MESSAGES')}</div>
       <div class="opdlg-m">${esc(String(msg==null?'':msg))}</div>
       ${champ}
       <div class="opdlg-b">
         <button class="btn ghost" onclick="_dlgRepond(null)">Annuler</button>
         <button class="btn" id="opdlg-ok" onclick="(function(){ const e=document.getElementById('opdlg-in'); _dlgRepond(e?e.value:''); })()">${esc(o.oui||'Valider')}</button></div>`,
      null, ()=>{ const e=$('opdlg-in'); if(e){ e.focus(); try{ e.select(); }catch(x){} } });
  }
  function closeSheet(){ $('sheet').classList.remove('open'); try{ dashHovHide(); }catch(e){} }
  $('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
  /* comme dans n'importe quelle application : Échap ferme la fenêtre */
  document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
    if(typeof _moveId!=='undefined'&&_moveId){ deplacerFin(); toast('Déplacement annulé'); return; }
    if($('sheet')&&$('sheet').classList.contains('open')){ closeSheet(); return; }
    if($('page')&&$('page').classList.contains('open')) closePage(); });

  // ===== Bouton « retour » du téléphone : ferme l'écran ouvert au lieu de quitter l'app =====
  function pushBack(){ try{ history.pushState({op:1},''); }catch(e){} }
  function anyOverlayOpen(){ return ['visio','camera','viewer','jitsi','ring','sheet','page','chat'].some(x=>{ const el=$(x); return el && el.classList.contains('open'); }); }
  function closeTopOverlay(){
    if($('visio')&&$('visio').classList.contains('open')){
      /* comme sur un téléphone : le bouton retour REDUIT l'appel, il ne
         raccroche pas. On raccroche avec le bouton rouge. */
      if(_vRoom&&_vGenre==='appel'&&!_vMini){ visioReduire(); return true; }
      visioFermer(); return true; }
    if($('camera')&&$('camera').classList.contains('open')){ camFermer(); return true; }
    if($('viewer')&&$('viewer').classList.contains('open')){ closeViewer(); return true; }
    if($('opdlg')&&$('opdlg').classList.contains('open')){ _dlgRepond(null); return true; }
    if($('jitsi')&&$('jitsi').classList.contains('open')){ closeJitsi(); return true; }
    if($('ring')&&$('ring').classList.contains('open')){ declineCall(); return true; }
    if($('sheet')&&$('sheet').classList.contains('open')){ closeSheet(); return true; }
    if($('page')&&$('page').classList.contains('open')){ closePage(); return true; }
    if($('chat')&&$('chat').classList.contains('open')){ closeChat(); return true; }
    return false;
  }
  window.addEventListener('popstate', function(){ if(anyOverlayOpen()){ closeTopOverlay(); pushBack(); } });
  try{ history.replaceState({op:0},''); }catch(e){}
</script>
</body>
</html>
